<body><div id="game"></div>
<header class="hud"><div class="brand">♜ TOWER DEFENDER<small>GOBLIN SIEGE · CAMPAIGN</small></div><div class="stats"><span>◈ <em id="gold">180</em></span><span>♥ <em id="lives">20</em></span><span>⚑ <em id="wave">0/12</em></span></div></header>

<script type="module">

scene.add(new THREE.HemisphereLight(0xe4f1ff,0x46503b,2));const sun=new THREE.DirectionalLight(0xffe1b1,2.3);sun.position.set(-12,24,10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);

for(let i=0;i<42;i++){let x=(Math.random()-.5)*50,z=(Math.random()-.5)*40;if(Math.abs(z-8)<3&&x<0)continue;let t=group();cyl(.15,.25,1,M.wood,x,.5,z,t);sphere(.8,M.leaf,x,1.5,z,t,1,1.15,1)}

function goblin(kind='goblin'){let g=group(),big=kind==='orc'||kind==='boss',fast=kind==='runner',fly=kind==='fly',s=big?1.5:fast?.78:1;g.scale.setScalar(s);let skin=big?M.orc:M.green,armor=big?M.red:M.wood;sphere(.34,skin,0,1.5,0,g,1,.95,.8);box(big?1:.62,.68,.45,armor,0,.94,0,g);sphere(.36,skin,0,1.8,.03,g,1,.9,.85);for(let side of [-1,1]){sphere(.06,M.fire,side*.14,1.86,.32,g);sphere(.035,M.dark,side*.14,1.86,.37,g);let ear=sphere(.18,skin,side*.43,1.8,0,g,1,.45,.65);ear.rotation.z=side*-.4;cyl(.12,.16,.65,M.wood,side*.2,.36,0,g).rotation.z=side*.1;cyl(.11,.14,.65,skin,side*.4,1.02,0,g).rotation.z=side*-.5;sphere(.13,skin,side*.58,.72,.03,g)}if(big){for(let i=-1;i<=1;i++)cyl(0,.14,.5,M.steel,i*.35,1.6,-.32,g,5)}else{cyl(.02,.3,.65,M.red,0,2.05,-.1,g,7);if(fly){for(let side of [-1,1]){let wing=box(.8,.06,.5,M.purple,side*.5,1.6,-.2,g);wing.rotation.z=side*.6}}}return g}

let gold=180,lives=20,wave=0,selected='archer',chosen=null,towers=[],enemies=[],shots=[],running=false,paused=false,speed=1,spawn=0,left=0,base=100;
const say=t=>{let el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1500)},ui=()=>{$('#gold').textContent=gold;$('#lives').textContent=lives;$('#wave').textContent=wave+'/12';$('#upgrade').disabled=!chosen;$('#sell').disabled=!chosen;$('#info').textContent=chosen?'Башня '+chosen.userData.type+' · уровень '+chosen.userData.level:'Коснись площадки, чтобы построить выбранную башню.'};

function build(p){let cost=selected==='archer'?70:selected==='mage'?110:140;if(gold<cost)return say('Недостаточно золота');gold-=cost;let t=towerModel(selected);t.position.set(p.userData.x,0,p.userData.z);t.userData.pad=p;p.userData.occupied=true;p.userData.tower=t;scene.add(t);towers.push(t);pickTower(t);ui()}

const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();function selectAt(x,y){let r=renderer.domElement.getBoundingClientRect();pointer.set((x-r.left)/r.width*2-1,-((y-r.top)/r.height)*2+1);ray.setFromCamera(pointer,camera);let hit=ray.intersectObjects(scene.children,true)[0]?.object;while(hit&&!hit.userData.kind&&!hit.userData.type)hit=hit.parent;if(!hit)return;if(hit.userData.kind==='pad'){if(hit.userData.occupied)pickTower(hit.userData.tower);else build(hit)}else if(hit.userData.type)pickTower(hit)}
