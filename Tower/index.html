<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#18251c"><title>Защита замка — Изометрическая осада</title>
<style>

e}.modal h1{color:#e6c17b}.modal p{font-size:13px}.hidden{display:none!important}
@media(max-width:700px){.hud{left:6px;right:6px;gap:5px}.brand{padding:6px 7px;font-size:9px}.brand small{font-size:6px}.stats{gap:7px;padding:7px;font-size:10px}.panel{left:6px;top:54px;width:126px;padding:5px}.heading{font-size:7px}.tower{padding:7px 5px;font-size:9px}.tower b{font-size:8px}#upgrade,#sell{font-size:8px;padding:7px 2px}.bottom{left:138px;right:6px;bottom:calc(6px + env(safe-area-inset-bottom));padding:5px;gap:4px}.bottom .btn{padding:9px 6px;font-size:9px}.bottom .group{gap:3px}}
@media(orientation:landscape) and (max-height:600px){.panel{left:8px;top:52px;width:132px}.bottom{left:148px;right:8px;bottom:6px}.brand{padding:5px 8px}.stats{padding:6px 8px}}
</style></head><body><div id="game"><canvas id="world"></canvas></div>
<header class="hud"><div class="brand">♜ ЗАЩИТА ЗАМКА<small>ИЗОМЕТРИЧЕСКАЯ ОСАДА · 12 ВОЛН</small></div><div class="stats"><span>◈ <em id="gold">360</em></span><span>♥ <em id="lives">20</em></span><span>⚑ <em id="wave">0/12</em></span></div></header>
<aside class="panel"><h3 class="heading">СТРОИТЕЛЬСТВО</h3><button class="tower active" data-kind="archer">🏹 Лучник <b>70 ◈</b></button><button class="tower" data-kind="mage">🔮 Маг <b>110 ◈</b></button><button class="tower" data-kind="ballista">⚒ Баллиста <b>140 ◈</b></button><button class="btn secondary" id="upgrade" disabled>УЛУЧШИТЬ</button><button class="btn secondary" id="sell" disabled>ПРОДАТЬ</button></aside>
<footer class="bottom"><button class="btn" id="start">⚔ ОСАДА</button><div class="group"><button class="btn secondary" id="volley">🏹 ЗАЛП</button><button class="btn secondary" id="pause">Ⅱ</button><button class="btn secondary" data-speed="1">1×</button><button class="btn secondary" data-speed="2">2×</button><button class="btn secondary" data-speed="3">3×</button></div></footer><div class="toast" id="toast"></div><div class="modal hidden" id="result"><h1 id="resultTitle">ПОБЕДА!</h1><p id="resultText"></p><button class="btn" onclick="location.reload()">ИГРАТЬ СНОВА</button></div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d'),$=s=>document.querySelector(s);
let W=0,H=0,DPR=1,scale=1,ox=0,oy=0,zoom=1;
const goldEl=$('#gold'),livesEl=$('#lives'),waveEl=$('#wave'),toast=$('#toast');
let gold=360,lives=20,wave=0,selected='archer',chosen=null,running=false,paused=false,speed=1,left=0,spawn=0,volleyCooldown=0,last=0,gameTime=0;
const towers=[],enemies=[],shots=[],particles=[];
const pads=[[-17,0],[-12,-5],[-8,13],[-4,-4],[0,14],[4,3],[8,14],[12,-5],[16,8],[17,-5]].map(([x,z],i)=>({x,z,id:i,occupied:false,tower:null}));
const route=[[-25,9],[-18,9],[-13,2],[-6,2],[0,8],[8,8],[14,1],[23,1]];
const trees=[];for(let i=0;i<65;i++){let x=(Math.random()-.5)*55,z=(Math.random()-.5)*38;if(Math.abs(z-8)<4&&x<0)continue;if(x>12&&z<9&&z>-5)continue;trees.push({x,z,r:.75+Math.random()*.55,shade:Math.random()})}
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);scale=Math.min(W/62,H/42)*zoom;ox=W*.5;oy=H*.48+Math.min(45,H*.07)}
function iso(x,z,y=0){return{x:ox+(x-z)*scale*.72,y:oy+(x+z)*scale*.36-y*scale*.72}}
function pathPoint(t){let n=(route.length-1)*t,i=Math.min(route.length-2,Math.floor(n)),f=n-i;return{x:route[i][0]+(route[i+1][0]-route[i][0])*f,z:route[i][1]+(route[i+1][1]-route[i][1])*f}}
function pathLength(){let n=0;for(let i=1;i<route.length;i++)n+=Math.hypot(route[i][0]-route[i-1][0],route[i][1]-route[i-1][1]);return n}
const routeDist=pathLength();
function say(s){toast.textContent=s;toast.classList.add('show');clearTimeout(say.timer);say.timer=setTimeout(()=>toast.classList.remove('show'),1500)}
function ui(){goldEl.textContent=gold;livesEl.textContent=lives;waveEl.textContent=wave+'/12';$('#upgrade').disabled=!chosen;$('#sell').disabled=!chosen;$('#start').disabled=running||wave>=12||lives<=0}
function poly(points,fill,stroke=null,line=1){ctx.beginPath();points.forEach((p,i)=>{const q=iso(p[0],p[1],p[2]||0);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=line;ctx.stroke()}}
function ellipse(x,z,rx,rz,color,y=0){const p=iso(x,z,y);ctx.beginPath();ctx.ellipse(p.x,p.y,rx*scale*.72,rz*scale*.36,0,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}
function diamond(x,z,w,d,fill,stroke){poly([[x-w/2,z],[x,z-d/2],[x+w/2,z],[x,z+d/2]],fill,stroke,1)}
function drawTree(t){const p=iso(t.x,t.z);ellipse(t.x,t.z,.65,.5,'#293c29');ctx.fillStyle='#68452e';ctx.fillRect(p.x-3*scale/20,p.y-24*scale/20,6*scale/20,24*scale/20);for(let k=0;k<3;k++){const yy=p.y-(.8+k*.38)*scale;ctx.beginPath();ctx.moveTo(p.x,yy-1.15*scale);ctx.lineTo(p.x-.7*scale,yy+.05*scale);ctx.lineTo(p.x+.7*scale,yy+.05*scale);ctx.closePath();ctx.fillStyle=['#385d36','#477442','#5d8b49'][(k+Math.floor(t.shade*3))%3];ctx.fill();ctx.strokeStyle='#294a2c';ctx.stroke()}}
function drawCastle(){// rocky island and keep
poly([[-1,-8,0],[17,-8,0],[25,0,0],[17,9,0],[-1,9,0],[-9,0,0]],'#777b70','#4b5547',2);
poly([[8,-5,0],[19,-5,0],[23,-1,0],[12,-1,0]],'#a8a18a');
poly([[8,-5,0],[12,-1,0],[12,7,0],[8,3,0]],'#555e64');poly([[12,-1,0],[23,-1,0],[23,7,0],[12,7,0]],'#707a7e');
for(let i=0;i<8;i++){let x=12+i*1.35;poly([[x,-1,0],[x+.85,-1,0],[x+.85,7,0],[x,7,0]],i%2?'#69757a':'#7b8588','#515c60',.5)}
poly([[8,-5,0],[19,-5,0],[23,-1,0],[12,-1,0]],'#9aa0a0','#4c5559',1);
for(const [x,z,h,c] of [[9,-4,6,'#8a9698'],[21,-4,6,'#8a9698'],[9,5,4.7,'#758185'],[21,5,4.7,'#758185']])drawKeepTower(x,z,h,c);
poly([[14,6,0],[17,6,0],[17,7,0],[14,7,0]],'#382a24');}
function drawKeepTower(x,z,h,c){const p=iso(x,z);const w=scale*1.2;ctx.fillStyle='#485157';ctx.fillRect(p.x-w/2,p.y-h*scale*.72,w,h*scale*.72);poly([[x-1,z-1,h],[x+1,z-1,h],[x+1,z+1,h],[x-1,z+1,h]],c);const top=iso(x,z,h);ctx.beginPath();ctx.moveTo(top.x,top.y-scale*1.5);ctx.lineTo(top.x-scale*.95,top.y);ctx.lineTo(top.x+scale*.95,top.y);ctx.closePath();ctx.fillStyle='#293846';ctx.fill();ctx.fillStyle='#8d3434';ctx.fillRect(top.x+scale*.45,top.y-scale*1.1,scale*.8,scale*.42)}
function drawPad(p){ellipse(p.x,p.z,1.05,.8,'#26342c');diamond(p.x,p.z,2.0,1.25,p.occupied?'#756344':'#9c895f','#dfc78d');diamond(p.x,p.z-.04,1.55,.95,p.occupied?'#53615b':'#788b65','#364c3b')}
function drawTower(t){const p=iso(t.x,t.z);ellipse(t.x,t.z,.8,.6,'#28362d');ctx.fillStyle='#6e7370';ctx.fillRect(p.x-scale*.35,p.y-scale*2.2,scale*.7,scale*2.2);ctx.fillStyle='#9b9b88';ctx.fillRect(p.x-scale*.46,p.y-scale*2.2,scale*.92,scale*.25);if(t.kind==='archer'){ctx.fillStyle='#725036';ctx.fillRect(p.x-scale*.5,p.y-scale*2.55,scale,scale*.4);ctx.fillStyle='#4a382b';ctx.fillRect(p.x-scale*.12,p.y-scale*3.5,scale*.24,scale);ctx.strokeStyle='#d8b36d';ctx.lineWidth=Math.max(1,scale*.07);ctx.beginPath();ctx.arc(p.x,p.y-scale*3.25,scale*.45,-1.2,1.2);ctx.stroke()}else if(t.kind==='mage'){ctx.fillStyle='#394d8a';ctx.beginPath();ctx.arc(p.x,p.y-scale*2.7,scale*.48,0,Math.PI*2);ctx.fill();ctx.fillStyle='#7fe4ff';ctx.beginPath();ctx.arc(p.x,p.y-scale*3.1,scale*.18,0,Math.PI*2);ctx.fill()}else{ctx.fillStyle='#6c4c36';ctx.fillRect(p.x-scale*.65,p.y-scale*2.65,scale*1.3,scale*.25);ctx.fillStyle='#b9c1c1';ctx.fillRect(p.x-scale*.05,p.y-scale*3.05,scale*.1,scale*.9)}if(chosen===t){ctx.strokeStyle='#ffe17c';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(p.x,p.y,scale*.9,scale*.42,0,0,Math.PI*2);ctx.stroke()}}
function drawEnemy(e){const p=iso(e.x,e.z,e.kind==='dragon'?3.3:e.kind==='fly'?1.6:0),s=scale*(e.kind==='boss'?1.05:e.kind==='dragon'?1.25:e.kind==='runner'?.62:.78);ellipse(e.x,e.z,.55,.35,'#263026');ctx.save();ctx.translate(p.x,p.y);ctx.scale(s,s);let skin=e.kind==='boss'||e.kind==='orc'?'#6e9b4b':'#86a94d';ctx.fillStyle=skin;ctx.fillRect(-7,-27,14,18);ctx.fillStyle='#4c5c39';ctx.fillRect(-9,-12,18,12);ctx.fillStyle='#c7b47b';ctx.fillRect(-8,-28,16,4);ctx.fillStyle='#d94b36';ctx.fillRect(-5,-21,3,3);ctx.fillRect(3,-21,3,3);ctx.fillStyle='#6b4b31';ctx.fillRect(-8,0,5,8);ctx.fillRect(3,0,5,8);if(e.kind==='dragon'){ctx.fillStyle='#3b4b63';ctx.beginPath();ctx.moveTo(-5,-20);ctx.lineTo(-26,-34);ctx.lineTo(-17,-12);ctx.lineTo(0,-17);ctx.lineTo(22,-36);ctx.lineTo(14,-12);ctx.closePath();ctx.fill()}if(e.kind==='wagon'){ctx.fillStyle='#69452d';ctx.fillRect(-19,-13,38,12);ctx.strokeStyle='#2a211c';ctx.lineWidth=4;ctx.beginPath();ctx.arc(-12,1,6,0,7);ctx.arc(12,1,6,0,7);ctx.stroke()}if(e.kind==='rider'){ctx.fillStyle='#d1d5db';ctx.fillRect(-12,-13,24,5);ctx.fillStyle='#74523a';ctx.fillRect(-15,-7,30,8)}ctx.restore();ctx.fillStyle='#221e1b';ctx.fillRect(p.x-s*12,p.y-s*38,s*24,3);ctx.fillStyle='#d74b3e';ctx.fillRect(p.x-s*12,p.y-s*38,s*24*Math.max(0,e.hp/e.max),3)}
function drawShot(s){const p=iso(s.x,s.z,s.y);ctx.fillStyle=s.kind==='mage'?'#75e4ff':s.kind==='ballista'?'#ff8545':'#ffe18a';ctx.beginPath();ctx.arc(p.x,p.y,Math.max(2,scale*.12),0,7);ctx.fill();ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=10;ctx.fill();ctx.shadowBlur=0}
function render(){ctx.clearRect(0,0,W,H);const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#8db3c2');sky.addColorStop(.65,'#c2c7a0');sky.addColorStop(1,'#6d8b58');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 // iso ground plane
 poly([[-29,-20,0],[29,-20,0],[29,20,0],[-29,20,0]],'#63864e','#425f3e',2);
 // winding river
 ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();route.forEach(([x,z],i)=>{const p=iso(x-2,z-15);i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)});ctx.strokeStyle='#357f9a';ctx.lineWidth=scale*2.4;ctx.stroke();ctx.strokeStyle='#9ac7c8';ctx.lineWidth=scale*.12;ctx.stroke();
 // road
 ctx.beginPath();route.forEach(([x,z],i)=>{const p=iso(x,z);i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)});ctx.strokeStyle='#806c50';ctx.lineWidth=scale*3.7;ctx.stroke();ctx.strokeStyle='#c0a77d';ctx.lineWidth=scale*3.1;ctx.stroke();
 trees.sort((a,b)=>(a.x+a.z)-(b.x+b.z)).forEach(drawTree);
 drawCastle();
 pads.forEach(drawPad);
 const ordered=[...towers.map(t=>({type:'tower',o:t,depth:t.x+t.z})),...enemies.map(e=>({type:'enemy',o:e,depth:e.x+e.z}))].sort((a,b)=>a.depth-b.depth);
 ordered.forEach(o=>o.type==='tower'?drawTower(o.o):drawEnemy(o.o));shots.forEach(drawShot);
 for(const p of particles){const q=iso(p.x,p.z,p.y);ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.fillRect(q.x,q.y,3,3)}ctx.globalAlpha=1;
 // top-down isometric compass-free scenery embellishments
 for(let i=0;i<10;i++){let x=-26+i*5.7,z=-17;const p=iso(x,z);ctx.fillStyle='#d5c18a';ctx.fillRect(p.x-2,p.y-2,4,4)}
}
function towerStats(kind){return{archer:{cost:70,damage:16,range:10,cool:.48},mage:{cost:110,damage:27,range:8.5,cool:1},ballista:{cost:140,damage:58,range:13,cool:1.55}}[kind]}
function build(p){const st=towerStats(selected);if(gold<st.cost)return say('Недостаточно золота');gold-=st.cost;const t={...st,kind:selected,x:p.x,z:p.z,level:1,pad:p,cooldown:0};p.occupied=true;p.tower=t;towers.push(t);pick(t);ui()}
function pick(t){chosen=t;ui()}
function spawnEnemy(){const r=Math.random();let kind=wave>=7&&r<.13?'dragon':wave>=5&&r<.29?'wagon':wave>=3&&r<.48?'rider':wave>=8&&r<.64?'boss':wave>=4&&r<.78?'orc':wave>=3&&r<.88?'fly':r<.94?'runner':'goblin';const hp=({dragon:260,wagon:390,rider:145,boss:300,orc:130,runner:38,fly:55,goblin:65}[kind]||65)*(1+wave*.16);const v=({dragon:.072,wagon:.026,rider:.078,boss:.035,runner:.095}[kind]||.055)*(1+wave*.025);enemies.push({kind,t:0,x:route[0][0],z:route[0][1],hp,max:hp,speed:v})}
function begin(){if(running||wave>=12||lives<=0)return;wave++;if(wave>1){const bonus=70+wave*22;gold+=bonus;say('Волна '+wave+' · награда +'+bonus+' ◈')}else say('Волна 1 начинается!');running=true;left=8+wave*2;spawn=0;ui()}
function volley(){if(volleyCooldown>0)return say('Залп готов через '+Math.ceil(volleyCooldown)+' сек.');if(!enemies.length)return say('Нет целей для залпа');let hit=0;for(const e of enemies)if(e.t>.48){e.hp-=95;hit++;for(let i=0;i<7;i++)particles.push({x:e.x,y:1+Math.random()*2,z:e.z,vx:(Math.random()-.5)*3,vy:Math.random()*3,vz:(Math.random()-.5)*3,life:.5,max:.5,color:'#ffd27a'})}volleyCooldown=22;$('#volley').textContent='🏹 ЗАЛП · 22с';say('Общий залп! Целей: '+hit)}
function update(dt){gameTime+=dt;if(volleyCooldown>0){volleyCooldown=Math.max(0,volleyCooldown-dt);$('#volley').textContent=volleyCooldown>0?'🏹 ЗАЛП · '+Math.ceil(volleyCooldown)+'с':'🏹 ЗАЛП'}if(running){spawn-=dt;if(left>0&&spawn<=0){spawnEnemy();left--;spawn=.85}for(const e of enemies){e.t+=e.speed*dt/routeDist;const p=pathPoint(Math.min(e.t,1));e.x=p.x;e.z=p.z}for(const t of towers){t.cooldown-=dt;let target=null;for(const e of enemies){if(e.t>=1)continue;if(Math.hypot(e.x-t.x,e.z-t.z)<=t.range&&(!target||e.t>target.t))target=e}if(target&&t.cooldown<=0){shots.push({x:t.x,z:t.z,y:3.2,target,kind:t.kind,damage:t.damage,speed:t.kind==='ballista'?18:24});t.cooldown=t.cool}}for(const s of shots){if(!enemies.includes(s.target)){s.dead=true;continue}const dx=s.target.x-s.x,dz=s.target.z-s.z,dist=Math.hypot(dx,dz),step=s.speed*dt;if(dist<.55){s.target.hp-=s.damage;s.dead=true;for(let i=0;i<8;i++)particles.push({x:s.target.x,y:1,z:s.target.z,vx:(Math.random()-.5)*4,vy:Math.random()*3,vz:(Math.random()-.5)*4,life:.4,max:.4,color:s.kind==='mage'?'#65dfff':'#ffd17b'})}else{s.x+=dx/dist*step;s.z+=dz/dist*step;s.y=Math.max(.4,s.y-step*.15)}}for(let i=shots.length-1;i>=0;i--)if(shots[i].dead)shots.splice(i,1);for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];if(e.hp<=0){gold+=({dragon:180,wagon:220,rider:65,boss:110,orc:38,runner:24}[e.kind]||20);enemies.splice(i,1)}else if(e.t>=1){lives--;enemies.splice(i,1)}}if(left===0&&enemies.length===0){running=false;if(wave===12){$('#resultTitle').textContent='ПОБЕДА!';$('#resultText').textContent='Крепость выстояла. Все 12 волн отражены.';$('#result').classList.remove('hidden')}else say('Волна отражена! Подготовь оборону.')}if(lives<=0){running=false;$('#resultTitle').textContent='ПОРАЖЕНИЕ';$('#resultText').textContent='Крепость пала на волне '+wave+'.';$('#result').classList.remove('hidden')}}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.z+=p.vz*dt;p.y+=p.vy*dt;p.vy-=5*dt;if(p.life<=0)particles.splice(i,1)}ui()}
function drawFrame(now){const dt=Math.min((now-last)/1000,.05)*(paused?0:speed);last=now;update(dt);render();requestAnimationFrame(drawFrame)}
function screenToWorld(px,py){const a=(px-ox)/(scale*.72),b=(py-oy)/(scale*.36);return{x:(a+b)/2,z:(b-a)/2}}
function hitTest(px,py){const w=screenToWorld(px,py);let nearest=null,dist=Infinity;for(const p of pads){const d=Math.hypot(w.x-p.x,w.z-p.z);if(d<1.7&&d<dist){nearest=p;dist=d}}if(nearest){if(nearest.occupied)pick(nearest.tower);else build(nearest)}}
let down=null,pinch=null;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);down={id:e.pointerId,x:e.clientX,y:e.clientY};});
canvas.addEventListener('pointerup',e=>{if(down&&down.id===e.pointerId&&Math.hypot(e.clientX-down.x,e.clientY-down.y)<9)hitTest(e.clientX,e.clientY);down=null;pinch=null});
canvas.addEventListener('wheel',e=>{zoom=Math.max(.7,Math.min(1.5,zoom*Math.exp(-e.deltaY*.001)));resize()},{passive:true});
canvas.addEventListener('touchmove',e=>{if(e.touches.length===2){e.preventDefault();const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch!==null){zoom=Math.max(.7,Math.min(1.5,zoom*d/pinch));resize()}pinch=d}else pinch=null},{passive:false});
document.querySelectorAll('.tower').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tower').forEach(x=>x.classList.remove('active'));b.classList.add('active');selected=b.dataset.kind;pick(null)});
$('#upgrade').onclick=()=>{if(!chosen)return;const cost=65*chosen.level;if(gold<cost)return say('Недостаточно золота');gold-=cost;chosen.level++;chosen.damage*=1.5;chosen.range+=.6;ui()};
$('#sell').onclick=()=>{if(!chosen)return;gold+=Math.round(chosen.cost*.6);chosen.pad.occupied=false;chosen.pad.tower=null;towers.splice(towers.indexOf(chosen),1);pick(null)};
$('#start').onclick=begin;$('#volley').onclick=volley;$('#pause').onclick=()=>{paused=!paused;$('#pause').textContent=paused?'▶':'Ⅱ'};document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{speed=+b.dataset.speed;document.querySelectorAll('[data-speed]').forEach(x=>x.style.borderColor=x===b?'#d5ad65':'#ffffff25')});
window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,120));resize();ui();requestAnimationFrame(t=>{last=t;requestAnimationFrame(drawFrame)});
})();
</script></body></html>
