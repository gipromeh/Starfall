let pointers=new Map(),gesture=null,moved=false;renderer.domElement.addEventListener('pointerdown',e=>{renderer.domElement.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){gesture={x:e.clientX,y:e.clientY,px:e.clientX,py:e.clientY};moved=false}else if(pointers.size===2){let a=[...pointers.values()];gesture={pinch:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};moved=true}});
renderer.domElement.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1&&gesture&&!('pinch'in gesture)){let dx=e.clientX-gesture.px,dy=e.clientY-gesture.py;if(Math.abs(e.clientX-gesture.x)+Math.abs(e.clientY-gesture.y)>5)moved=true;if(moved){yaw-=dx*.006;pitch=THREE.MathUtils.clamp(pitch+dy*.004,.35,1.18);cameraUpdate()}gesture.px=e.clientX;gesture.py=e.clientY}else if(pointers.size===2&&gesture?.pinch){let a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);dist=THREE.MathUtils.clamp(dist-(d-gesture.pinch)*.06,25,64);gesture.pinch=d;cameraUpdate()}});
function pointerEnd(e){if(!pointers.has(e.pointerId))return;pointers.delete(e.pointerId);if(pointers.size===0){if(!moved&&gesture&&!('pinch'in gesture))selectAt(e.clientX,e.clientY);gesture=null;moved=false}else if(pointers.size===1){let p=[...pointers.values()][0];gesture={x:p.x,y:p.y,px:p.x,py:p.y};moved=true}}
renderer.domElement.addEventListener('pointerup',pointerEnd);renderer.domElement.addEventListener('pointercancel',pointerEnd);renderer.domElement.addEventListener('wheel',e=>{dist=THREE.MathUtils.clamp(dist+e.deltaY*.025,25,64);cameraUpdate()},{passive:true});
let last=performance.now();function tick(now){requestAnimationFrame(tick);let dt=Math.min((now-last)/1000,.05)*(paused?0:speed);last=now;if(running&&dt){spawn-=dt;if(left>0&&spawn<=0){spawnEnemy();left--;spawn=.85}for(let e of enemies){e.t+=e.speed*dt;e.mesh.position.copy(route.getPoint(Math.min(e.t,1)));e.mesh.position.y=e.kind==='fly'?1.8+Math.sin(now*.004)*.18:0;const tangent=route.getTangent(Math.min(e.t,1));e.mesh.rotation.y=Math.atan2(tangent.x,tangent.z);if(e.mesh.userData.mixer)e.mesh.userData.mixer.update(dt)}for(let t of towers){t.userData.cool-=dt;let targetEnemy=null,best=-Infinity;for(const e of enemies){if(e.t>=1)continue;const d=e.mesh.position.distanceTo(t.position);if(d<=t.userData.range&&e.t>best){best=e.t;targetEnemy=e}}if(targetEnemy&&t.userData.cool<=0){const aim=targetEnemy.mesh.position.clone();t.userData.weapon.lookAt(aim.x,aim.y+1,aim.z);const origin=t.localToWorld(new THREE.Vector3(0,t.userData.type==='archer'?3.7:t.userData.type==='mage'?3.5:3.1,0));const p=sphere(t.userData.type==='ballista'?.2:.16,t.userData.type==='mage'?M.magic:t.userData.type==='ballista'?M.fire:M.gold,origin.x,origin.y,origin.z);shots.push({mesh:p,target:targetEnemy,speed:t.userData.type==='ballista'?18:24,damage:t.userData.damage,type:t.userData.type});scene.add(p);t.userData.cool=t.userData.type==='archer'?.48:t.userData.type==='mage'?1:1.55}}for(let s of shots){if(!enemies.includes(s.target)){scene.remove(s.mesh);s.mesh.userData.dead=true;continue}let dest=s.target.mesh.position.clone().add(new THREE.Vector3(0,1.05,0)),dir=dest.clone().sub(s.mesh.position);if(dir.length()<.45){s.target.hp-=s.damage;if(s.type==='mage')for(let e of enemies)if(e!==s.target&&e.mesh.position.distanceTo(s.target.mesh.position)<2)e.hp-=s.damage*.45;s.mesh.userData.dead=true}else{s.mesh.position.add(dir.normalize().multiplyScalar(s.speed*dt))}}for(let s of shots.filter(s=>s.mesh.userData.dead)){scene.remove(s.mesh);shots.splice(shots.indexOf(s),1)}for(let e of [...enemies]){if(e.hp<=0){gold+=e.kind==='boss'?110:e.kind==='orc'?38:e.kind==='runner'?24:20;scene.remove(e.mesh);enemies.splice(enemies.indexOf(e),1)}else if(e.t>=1){lives--;base=Math.max(0,base-5);scene.remove(e.mesh);enemies.splice(enemies.indexOf(e),1)}}if(running&&left===0&&enemies.length===0){running=false;if(wave===12){$('#resultTitle').textContent='ПОБЕДА!';$('#resultText').textContent='Крепость выстояла. Все 12 волн отражены.';$('#result').classList.remove('hidden')}else say('Волна отражена! Подготовь оборону.')}if(lives<=0){running=false;$('#resultTitle').textContent='ПОРАЖЕНИЕ';$('#resultText').textContent='Крепость пала на волне '+wave+'.';$('#result').classList.remove('hidden')}ui()}renderer.render(scene,camera)}requestAnimationFrame(tick);
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}window.addEventListener('resize',resize);resize();ui();
