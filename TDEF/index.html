<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17221c">
<title>TDEF — Tower Defense</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#17221c;font-family:Arial,sans-serif}
#renderCanvas{width:100%;height:100%;display:block;touch-action:none;outline:none}
#loading,#error{position:fixed;z-index:30;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:#f3ead5;background:#17221c}
#error{display:none;background:#241b18}.message{max-width:620px;line-height:1.55}.message strong{display:block;font-size:20px;margin-bottom:12px}
#rotate{display:none;position:fixed;z-index:20;inset:0;align-items:center;justify-content:center;text-align:center;padding:28px;color:#fff4dc;background:#101a17ef}
#gameHud{position:fixed;z-index:8;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));max-width:min(330px,calc(100vw - 20px));color:#f3ead5;background:#18251de8;border:1px solid #d4b77966;border-radius:9px;font-size:12px;box-shadow:0 3px 14px #0005}
#gameHud summary{display:flex;align-items:center;min-height:36px;padding:6px 9px;cursor:pointer;list-style:none;font-weight:600}
#gameHud summary::-webkit-details-marker{display:none}#gameHud summary .stats{display:flex;gap:10px;flex-wrap:wrap}
#gameHud .controls{display:grid;grid-template-columns:1fr auto;gap:6px;padding:0 9px 9px}
#gameHud button,#gameHud select{min-height:34px;border:1px solid #b99a68;border-radius:6px;background:#354638;color:#fff4dc;padding:6px 9px;font-weight:600;font-size:12px}
#gameHud button:disabled{opacity:.45}#gameHud label{align-self:center}
#gameMessage{grid-column:1/-1;min-height:18px;line-height:1.3;color:#f4d99a}
#contextMenu{position:fixed;z-index:12;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(570px,calc(100vw - 24px));padding:12px;color:#f5eedf;background:#17241ff2;border:1px solid #d5b77b99;border-radius:13px;box-shadow:0 8px 30px #0008;backdrop-filter:blur(12px)}
#contextMenu[hidden]{display:none}
.contextHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
#contextTitle{font-size:15px;font-weight:700}#contextInfo{font-size:11px;color:#c9c1ae;margin-bottom:10px}
.contextGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.contextGrid button{min-width:0;min-height:76px;padding:8px 5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:1px solid #77877a;border-radius:9px;background:#2d4035;color:#fff4dc;font-size:12px;font-weight:700}
.contextGrid button:disabled{opacity:.4}.contextGrid button .symbol{font-size:22px;line-height:1.1}.contextGrid button small{font-size:10px;color:#e5d5ac;font-weight:400}
.contextActions{display:flex;gap:8px}.contextActions button{flex:1;min-height:40px;border:1px solid #b99a68;border-radius:8px;background:#354638;color:#fff4dc;font-weight:700}
.contextActions button.sell{background:#593d31;border-color:#b47b60}
#closeContext{border:0;background:transparent;color:#e8ddc8;font-size:21px;padding:0 5px}
@media(orientation:portrait){#rotate{display:flex}#gameHud{max-width:calc(100vw - 20px)}#contextMenu{bottom:max(12px,env(safe-area-inset-bottom))}}
@media(orientation:landscape) and (max-height:480px){#gameHud summary{min-height:31px;padding:4px 8px}#contextMenu{padding:8px}.contextGrid button{min-height:62px}}
</style>
</head>
<body>
<div id="loading"><div class="message"><strong>Загрузка 3D-сцены…</strong>Инициализация Babylon.js.</div></div>
<div id="error"><div class="message"><strong id="errorTitle">Ошибка сцены</strong><span id="errorText"></span></div></div>
<div id="rotate"><div class="message"><strong>↻ Поверните устройство горизонтально</strong><br>Сцена рассчитана на альбомную ориентацию.</div></div>
<details id="gameHud" aria-label="Панель игры">
<summary><span class="stats"><span>Золото <strong id="goldValue">100</strong></span><span>База <strong id="baseValue">20</strong></span><span>Волна <strong id="waveValue">0</strong></span><span>Убийства <strong id="killsValue">0</strong></span></span></summary>
<div class="controls">
<button id="startWave" type="button">Старт волны</button>
<button id="pauseGame" type="button" disabled>Пауза</button>
<label for="gameSpeed">Скорость</label>
<select id="gameSpeed"><option value="1">×1</option><option value="2">×2</option><option value="3">×3</option></select>
<span>Площадка: <strong id="selectedPad">—</strong></span>
<div id="gameMessage" role="status" aria-live="polite">Нажмите на площадку, чтобы выбрать башню.</div>
</div>
</details>
<section id="contextMenu" hidden aria-label="Действия с башней или площадкой">
<div class="contextHead"><div id="contextTitle">Площадка</div><button id="closeContext" type="button" aria-label="Закрыть">×</button></div>
<div id="contextInfo">Выберите тип башни</div>
<div class="contextGrid" id="buildOptions">
<button type="button" data-build="gunner"><span class="symbol">◉</span><span>Gunner</span><small data-price>50 золота</small></button>
<button type="button" data-build="mortar"><span class="symbol">◌</span><span>Мортира</span><small data-price>100 золота</small></button>
<button type="button" data-build="magic"><span class="symbol">✧</span><span>Магическая</span><small data-price>90 золота</small></button>
</div>
<div class="contextActions" id="towerActions">
<button id="upgradeTower" type="button">Улучшить</button>
<button id="sellTower" class="sell" type="button">Продать</button>
</div>
</section>
<canvas id="renderCanvas"></canvas>
<script type="module" src="./src/main.js"></script>
</body>
</html>
