<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17221c">
<title>TDEF — Babylon.js Scene</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#17221c;font-family:Arial,sans-serif}
#renderCanvas{width:100%;height:100%;display:block;touch-action:none;outline:none}
#hint{position:fixed;z-index:5;left:max(12px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));padding:9px 12px;color:#f3ead5;background:#18251dcc;border:1px solid #d4b77966;border-radius:8px;font-size:12px;line-height:1.45;pointer-events:none}
#loading,#error{position:fixed;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:#f3ead5;background:#17221c}
#error{display:none;background:#241b18}.message{max-width:620px;line-height:1.55}.message strong{display:block;font-size:20px;margin-bottom:12px}
#rotate{display:none;position:fixed;z-index:10;inset:0;align-items:center;justify-content:center;text-align:center;padding:28px;color:#fff4dc;background:#101a17ef}
@media(orientation:portrait){#rotate{display:flex}#hint{max-width:calc(100vw - 24px);font-size:11px}}
@media(orientation:landscape) and (max-height:480px){#hint{font-size:10px;padding:6px 9px}}
</style>
</head>
<body>
<div id="loading"><div class="message"><strong>Загрузка 3D-сцены…</strong>Инициализация Babylon.js.</div></div>
<div id="error"><div class="message"><strong id="errorTitle">Ошибка сцены</strong><span id="errorText"></span></div></div>
<div id="rotate"><div class="message"><strong>↻ Поверните устройство горизонтально</strong><br>Сцена рассчитана на альбомную ориентацию.</div></div>
<div id="hint"><strong>TDEF · 3D-ПРЕДПРОСМОТР</strong><br>Мышь / один палец — вращение · Колесо / pinch — масштаб · ПКМ / два пальца — перемещение</div>
<canvas id="renderCanvas"></canvas>
<script type="module" src="./src/main.js"></script>
</body>
</html>
