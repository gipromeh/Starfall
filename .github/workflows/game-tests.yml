name: game-tests

on:
  pull_request:
    branches: [main, fix-v89-pirate-combat-density, lab/elite-combat-ai]
  push:
    branches: [main, lab/elite-combat-ai]
  workflow_dispatch:

concurrency:
  group: starfall-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: 22
  PLAYWRIGHT_VERSION: 1.56.1

jobs:
  quick-checks:
    name: quick-checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Check embedded game JavaScript
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class InlineScripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active = False
                  self.parts = []
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script" and not dict(attrs).get("src"):
                      self.active = True
                      self.parts = []
              def handle_data(self, data):
                  if self.active:
                      self.parts.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.active:
                      source = "".join(self.parts)
                      if source.strip():
                          self.scripts.append(source)
                      self.active = False

          parser = InlineScripts()
          parser.feed(Path("STARFALL_CURRENT.html").read_text(encoding="utf-8"))
          if not parser.scripts:
              raise SystemExit("No inline JavaScript blocks found")
          for i, source in enumerate(parser.scripts):
              Path(f"/tmp/starfall-inline-{i}.js").write_text(source, encoding="utf-8")
          print(f"Extracted {len(parser.scripts)} inline scripts")
          PY
          for script in /tmp/starfall-inline-*.js; do node --check "$script"; done
      - name: Check syntax of every test
        run: |
          find tests -maxdepth 1 -type f -name '*.js' -print0 |
            xargs -0 -r -n1 node --check

  browser-core:
    name: browser-core
    needs: quick-checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore npm package cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: starfall-npm-${{ runner.os }}-node${{ env.NODE_VERSION }}-pw${{ env.PLAYWRIGHT_VERSION }}-three0.128.0-tsparticles2.12.0
      - name: Restore Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: starfall-playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium-v1
      - name: Install pinned test dependencies
        run: npm install --no-save --no-package-lock playwright@${{ env.PLAYWRIGHT_VERSION }} three@0.128.0 tsparticles@2.12.0
      - name: Install Chromium if cache is empty
        run: npx playwright install chromium
      - name: Run core gameplay regressions
        env:
          SF_NM: ${{ github.workspace }}/node_modules
        run: |
          set -euo pipefail
          node tests/t1_saves.js
          node tests/t5_leak.js
          node tests/t11_pirate_fleet.js
          node tests/t13_ai_lab_browser.js
          node tests/t16_deep_space.js

  iphone-webkit:
    name: iphone-webkit
    needs: quick-checks
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore npm package cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: starfall-npm-${{ runner.os }}-node${{ env.NODE_VERSION }}-pw${{ env.PLAYWRIGHT_VERSION }}-three0.128.0-tsparticles2.12.0
      - name: Restore Playwright WebKit
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: starfall-playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-webkit-v1
      - name: Install pinned test dependencies
        run: npm install --no-save --no-package-lock playwright@${{ env.PLAYWRIGHT_VERSION }} three@0.128.0 tsparticles@2.12.0
      - name: Install WebKit if cache is empty
        run: npx playwright install webkit
      - name: Run iPhone WebKit regression
        env:
          SF_NM: ${{ github.workspace }}/node_modules
        run: node tests/t15_iphone_webkit.js

  ci-metrics:
    name: ci-metrics
    if: always()
    needs: [quick-checks, browser-core, iphone-webkit]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Collect duration and failure statistics
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner, repo, run_id: context.runId, per_page: 100
            });
            const duration = (start, end) => {
              if (!start || !end) return null;
              return Math.max(0, Math.round((Date.parse(end) - Date.parse(start)) / 1000));
            };
            const jobs = data.jobs
              .filter(job => job.name !== 'ci-metrics')
              .map(job => ({
                name: job.name,
                status: job.conclusion || job.status,
                duration_seconds: duration(job.started_at, job.completed_at),
                failed_steps: (job.steps || []).filter(step => step.conclusion === 'failure').map(step => step.name),
                steps: (job.steps || []).map(step => ({
                  name: step.name,
                  status: step.conclusion || step.status,
                  duration_seconds: duration(step.started_at, step.completed_at)
                }))
              }));
            const metrics = {
              repository: context.repo.owner + '/' + context.repo.repo,
              run_id: context.runId,
              run_number: context.runNumber,
              commit: context.sha,
              branch: context.ref,
              recorded_at: new Date().toISOString(),
              jobs
            };
            fs.writeFileSync('ci-metrics.json', JSON.stringify(metrics, null, 2));
            const summary = core.summary
              .addHeading('STARFALL CI — duration and failure report')
              .addRaw('Run #' + context.runNumber + ' · commit ' + context.sha.slice(0, 12))
              .addTable([
                [{data:'Job',header:true},{data:'Result',header:true},{data:'Duration',header:true},{data:'Failed steps',header:true}],
                ...jobs.map(job => [job.name, job.status,
                  job.duration_seconds == null ? 'in progress' : job.duration_seconds + ' s',
                  job.failed_steps.length ? job.failed_steps.join(', ') : '—'])
              ]);
            for (const job of jobs) {
              if (job.steps.length) {
                summary.addHeading(job.name + ' — step timings', 3)
                  .addTable([
                    [{data:'Step',header:true},{data:'Result',header:true},{data:'Duration',header:true}],
                    ...job.steps.map(step => [step.name, step.status,
                      step.duration_seconds == null ? '—' : step.duration_seconds + ' s'])
                  ]);
              }
            }
            await summary.write();
      - name: Store machine-readable CI metrics
        uses: actions/upload-artifact@v4
        with:
          name: starfall-ci-metrics-${{ github.run_number }}
          path: ci-metrics.json
          if-no-files-found: error
          retention-days: 90
