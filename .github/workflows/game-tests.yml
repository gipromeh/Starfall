name: game-tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Новые коммиты отменяют устаревший запуск той же ветки.
concurrency:
  group: starfall-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  quick-checks:
    name: quick-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: AI Lab architecture regression (static)
        run: node tests/t12_ai_lab.js
      - name: Radar and collision regression (static)
        run: node tests/t14_radar_collision_regression.js

  browser-tests:
    name: browser-tests
    needs: quick-checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm-пакеты кэшируются отдельно от браузера Playwright.
      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: starfall-npm-${{ runner.os }}-node22-playwright1.56.1-three0.128.0-tsparticles2.12.0

      - name: Cache Playwright Chromium
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: starfall-playwright-${{ runner.os }}-1.56.1-chromium

      - name: Install test dependencies
        run: npm install --no-save --no-package-lock playwright@1.56.1 three@0.128.0 tsparticles@2.12.0

      - name: Install Chromium (cache miss only)
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      # Каждый сценарий запускается независимо: сбой одного не скрывает результаты остальных.
      - name: AI Lab browser runtime smoke test
        id: ai-lab-browser
        continue-on-error: true
        run: node tests/t13_ai_lab_browser.js

      - name: Nuclear impact performance test
        id: nuclear-performance
        continue-on-error: true
        run: SF_NM="$PWD/node_modules" node tests/t8_nuke.js

      - name: Existing graphics/resource probe
        id: graphics-probe
        continue-on-error: true
        run: SF_NM="$PWD/node_modules" node tests/t6_probe.js

      - name: Pirate fleet regression test
        id: pirate-fleet
        continue-on-error: true
        run: SF_NM="$PWD/node_modules" node tests/t11_pirate_fleet.js

      - name: Fail if any browser test failed
        if: always()
        env:
          AI_LAB_BROWSER: ${{ steps.ai-lab-browser.outcome }}
          NUCLEAR_PERFORMANCE: ${{ steps.nuclear-performance.outcome }}
          GRAPHICS_PROBE: ${{ steps.graphics-probe.outcome }}
          PIRATE_FLEET: ${{ steps.pirate-fleet.outcome }}
        run: |
          failed=0
          for result in "$AI_LAB_BROWSER" "$NUCLEAR_PERFORMANCE" "$GRAPHICS_PROBE" "$PIRATE_FLEET"; do
            if [ "$result" != "success" ]; then
              echo "::error::Browser test result: $result"
              failed=1
            fi
          done
          exit "$failed"

  ci-metrics:
    name: ci-metrics
    if: always()
    needs: [quick-checks, browser-tests]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Collect duration and failure statistics
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner,
              repo,
              run_id: context.runId,
              per_page: 100
            });
            const duration = (start, end) => {
              if (!start || !end) return null;
              return Math.max(0, Math.round((Date.parse(end) - Date.parse(start)) / 1000));
            };
            const jobs = data.jobs
              .filter(job => job.name !== 'ci-metrics')
              .map(job => ({
                name: job.name,
                status: job.conclusion || job.status,
                duration_seconds: duration(job.started_at, job.completed_at),
                failed_steps: (job.steps || [])
                  .filter(step => step.conclusion === 'failure')
                  .map(step => step.name),
                steps: (job.steps || []).map(step => ({
                  name: step.name,
                  status: step.conclusion || step.status,
                  duration_seconds: duration(step.started_at, step.completed_at)
                }))
              }));
            const metrics = {
              repository: context.repo.owner + '/' + context.repo.repo,
              run_id: context.runId,
              run_number: context.runNumber,
              commit: context.sha,
              branch: context.ref,
              recorded_at: new Date().toISOString(),
              jobs
            };
            fs.writeFileSync('ci-metrics.json', JSON.stringify(metrics, null, 2));
            const summary = core.summary
              .addHeading('STARFALL CI — duration and failure report')
              .addRaw('Run #' + context.runNumber + ' · commit ' + context.sha.slice(0, 12))
              .addTable([
                [{data:'Job',header:true},{data:'Result',header:true},{data:'Duration',header:true},{data:'Failed steps',header:true}],
                ...jobs.map(job => [
                  job.name,
                  job.status,
                  job.duration_seconds == null ? 'in progress' : job.duration_seconds + ' s',
                  job.failed_steps.length ? job.failed_steps.join(', ') : '—'
                ])
              ]);
            for (const job of jobs) {
              if (job.steps.length) {
                summary.addHeading(job.name + ' — step timings', 3)
                  .addTable([
                    [{data:'Step',header:true},{data:'Result',header:true},{data:'Duration',header:true}],
                    ...job.steps.map(step => [
                      step.name,
                      step.status,
                      step.duration_seconds == null ? '—' : step.duration_seconds + ' s'
                    ])
                  ]);
              }
            }
            await summary.write();

      - name: Store machine-readable CI metrics
        uses: actions/upload-artifact@v4
        with:
          name: starfall-ci-metrics-${{ github.run_number }}
          path: ci-metrics.json
          if-no-files-found: error
          retention-days: 90
