name: game-tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm install --no-save playwright@1.56.1 three@0.128.0 tsparticles@2.12.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: STARFALL AI Lab architecture regression
        run: node tests/t12_ai_lab.js
      - name: STARFALL AI Lab browser runtime smoke test
        run: node tests/t13_ai_lab_browser.js
      - name: Nuclear impact performance test
        run: SF_NM="$PWD/node_modules" node tests/t8_nuke.js
      - name: Existing graphics probe
        run: SF_NM="$PWD/node_modules" node tests/t6_probe.js
      - name: Pirate fleet regression test
        run: SF_NM="$PWD/node_modules" node tests/t11_pirate_fleet.js
