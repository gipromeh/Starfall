name: combat-ai-lab
on:
  push:
    branches: [lab/elite-combat-ai]
    paths:
      - 'tools/combat-ai-lab/**'
      - 'tests/t17_combat_ai_lab.mjs'
      - 'tests/t18_eai_parity.js'
      - 'tests/t19_production_combat_batch.js'
      - '.github/workflows/combat-ai-lab.yml'
  pull_request:
    branches: [lab/elite-combat-ai]
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: starfall-combat-ai-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kernel-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/t17_combat_ai_lab.mjs
  production-kernel-parity:
    needs: kernel-regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependencies
        run: npm install --no-save --no-package-lock playwright@1.56.1 three@0.128.0 tsparticles@2.12.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Compare Node kernel with production EAI in Chromium
        env:
          SF_NM: ${{ github.workspace }}/node_modules
        run: node tests/t18_eai_parity.js
  production-combat-batch:
    needs: production-kernel-parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependencies
        run: npm install --no-save --no-package-lock playwright@1.56.1 three@0.128.0 tsparticles@2.12.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run real production combat batch
        env:
          SF_NM: ${{ github.workspace }}/node_modules
        run: node tests/t19_production_combat_batch.js
      - name: Upload production combat report
        uses: actions/upload-artifact@v4
        with:
          name: starfall-production-combat-${{ github.run_number }}
          path: artifacts/production-combat.json
          if-no-files-found: error
          retention-days: 30
  batch-simulation:
    needs: [kernel-regression, production-kernel-parity, production-combat-batch]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run 1,200 deterministic combat trials
        run: node tools/combat-ai-lab/run.mjs
      - name: Upload simulation reports
        uses: actions/upload-artifact@v4
        with:
          name: starfall-combat-ai-lab-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
