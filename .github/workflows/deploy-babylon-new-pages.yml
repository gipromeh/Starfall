name: Deploy STARFALL site and Tower sub-app

on:
  push:
    branches: [main]
    paths:
      - "Babylon New/**"
      - "Tower/**"
      - ".github/workflows/deploy-babylon-new-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Babylon New
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "Babylon New/package.json"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Starfall site
        run: npm run build

      - name: Download CC0 rigged enemy models
        working-directory: .
        run: |
          mkdir -p Tower/assets/minions
          base="https://gobkit.com/freebies/minion"
          for model in minion-a01 minion-a02 minion-b01 minion-b02 minion-c01 minion-c02 minion-d01 minion-d02; do
            curl --fail --location --retry 3 --retry-delay 2 "$base/$model.glb" -o "Tower/assets/minions/$model.glb"
            test "$(head -c 4 "Tower/assets/minions/$model.glb")" = glTF
          done
          printf '%s\\n' 'Gobkit Minion Pack — CC0 1.0 Universal' 'Source: https://gobkit.com/freebies' 'Rigged GLB models; commercial use, modification and redistribution permitted.' > Tower/assets/minions/LICENSE.txt

      - name: Add standalone Tower app without touching Starfall sources
        working-directory: .
        run: |
          mkdir -p "Babylon New/dist/Tower"
          cp -R Tower/. "Babylon New/dist/Tower/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "Babylon New/dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
