name: Deploy STARFALL site and Tower sub-app

on:
  push:
    branches: [main]
    paths:
      - "Babylon New/**"
      - "Tower/**"
      - ".github/workflows/deploy-babylon-new-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Babylon New
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "Babylon New/package.json"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Starfall site
        run: npm run build

      - name: Download CC0 rigged enemy models
        working-directory: .
        run: |
          mkdir -p Tower/assets/orcs
          base="https://gobkit.com/freebies/human006"
          for model in OrcIronGuard OrcLegionArcher OrcLegionCommander OrcLegionary OrcShieldBearer OrcWarDrummer OrcWarShaman OrcWarbandChampion; do
            curl --fail --location --retry 3 --retry-delay 2 "$base/$model.glb" -o "Tower/assets/orcs/$model.glb"
            test "$(head -c 4 "Tower/assets/orcs/$model.glb")" = glTF
          done
          printf '%s\\n' 'Gobkit Orc Legion Pack — CC0 1.0 Universal' 'Source: https://gobkit.com/freebies' 'Rigged GLB models with Idle, Walk, Run, Attack, Hit and Death clips.' > Tower/assets/orcs/LICENSE.txt
          mkdir -p Tower/assets/nature Tower/assets/creatures Tower/assets/raiders
          for model in TreeHigh001 TreeHigh002 TreeHigh003 TreeLow001 TreeLow002 TreeLow003 TreeLow004 TreeMed001 TreeMed002 TreeMed003; do
            curl --fail --location --retry 3 --retry-delay 2 "https://gobkit.com/freebies/environment/$model.glb" -o "Tower/assets/nature/$model.glb"
            test "$(head -c 4 "Tower/assets/nature/$model.glb")" = glTF
          done
          curl --fail --location --retry 3 --retry-delay 2 "https://gobkit.com/freebies/dino/Pterodactylus.glb" -o Tower/assets/creatures/Pterodactylus.glb
          curl --fail --location --retry 3 --retry-delay 2 "https://gobkit.com/freebies/animal012/PalominoHorse.glb" -o Tower/assets/creatures/PalominoHorse.glb
          curl --fail --location --retry 3 --retry-delay 2 "https://gobkit.com/freebies/animal005/Bull.glb" -o Tower/assets/creatures/Bull.glb
          curl --fail --location --retry 3 --retry-delay 2 "https://gobkit.com/freebies/human013/KnightCaptain.glb" -o Tower/assets/raiders/KnightCaptain.glb
          for file in Tower/assets/nature/*.glb Tower/assets/creatures/*.glb Tower/assets/raiders/*.glb; do test "$(head -c 4 "$file")" = glTF; done
          printf '%s\\n' 'Gobkit free assets — CC0 1.0 Universal' 'Source: https://gobkit.com/api/free' 'Trees, pterodactyl, bull, palomino horse and knight rider.' > Tower/assets/ASSET-LICENSES.txt

      - name: Add standalone Tower app without touching Starfall sources
        working-directory: .
        run: |
          mkdir -p "Babylon New/dist/Tower"
          cp -R Tower/. "Babylon New/dist/Tower/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "Babylon New/dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
