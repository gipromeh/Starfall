name: Deploy STARFALL to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare STARFALL site
        run: |
          set -euo pipefail
          mkdir -p _site/pirate-ai
          cp index.html starfall.html AI_LAB.html _site/
          cp STARFALL_PIRATE_AI_v1.2.1.html _site/pirate-ai/index.html
          cp -R assets tools data src _site/
          test -s _site/src/vendor/yuka.js
          test -s _site/src/ai/yuka-pirate-decision.js
          test -s _site/src/ai/starfall-yuka-adapter.js
          test -s _site/src/ai/yuka-pirate-flight.js
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/starfall.html
          test -s _site/tools/galaxy-map.js
          test -s _site/tools/external-systems.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
