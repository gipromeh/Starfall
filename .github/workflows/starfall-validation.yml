name: Starfall JavaScript validation

on:
  pull_request:
    branches: [main]
    paths:
      - "starfall.html"
      - "tools/validate-starfall.mjs"
      - "tests/t11_pirate_fleet.js"
      - "tests/lib.js"
      - "src/ai/yuka-pirate-decision.js"
      - "src/ai/starfall-yuka-adapter.js"
      - "src/ai/yuka-pirate-flight.js"
      - "src/vendor/yuka.js"
      - "tests/t26_pirate_transport_collision.js"
      - "tests/t27_yuka_ai_architecture.js"
      - ".github/workflows/starfall-validation.yml"
  push:
    branches: ['feat/**']
    paths:
      - "starfall.html"
      - "tools/validate-starfall.mjs"
      - "tests/t11_pirate_fleet.js"
      - "tests/lib.js"
      - "src/ai/yuka-pirate-decision.js"
      - "src/ai/starfall-yuka-adapter.js"
      - "src/ai/yuka-pirate-flight.js"
      - "src/vendor/yuka.js"
      - "tests/t26_pirate_transport_collision.js"
      - "tests/t27_yuka_ai_architecture.js"
      - ".github/workflows/starfall-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse inline scripts and check pirate regressions
        run: node tools/validate-starfall.mjs

  pirate-browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependencies
        run: npm install --no-save --no-package-lock playwright@1.56.1 three@0.128.0 tsparticles@2.12.0
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run pirate fleet browser regression
        env:
          SF_NM: ${{ github.workspace }}/node_modules
        run: node tests/t11_pirate_fleet.js
