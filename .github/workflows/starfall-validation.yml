name: Starfall JavaScript validation

on:
  pull_request:
    branches: [main]
    paths:
      - "starfall.html"
      - "tools/validate-starfall.mjs"
      - ".github/workflows/starfall-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse inline scripts and check pirate regressions
        run: node tools/validate-starfall.mjs
