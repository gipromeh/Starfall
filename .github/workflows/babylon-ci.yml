name: Babylon Chromium QA

on:
  push:
    paths:
      - "Babylon/**"
      - ".github/workflows/babylon-ci.yml"
  pull_request:
    paths:
      - "Babylon/**"
      - ".github/workflows/babylon-ci.yml"
  workflow_dispatch:

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Babylon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Babylon/package.json
      - name: Install test runner
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Babylon browser tests
        run: npm test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: babylon-playwright-report
          path: Babylon/test-results/
          if-no-files-found: ignore
