// Twin neon pulse cannons. The bolts animate forward from the actual gun muzzles.
const laserBolts=[];
for(const [i,x] of [-.48,.48].entries()){
 const hazeMat=new THREE.MeshBasicMaterial({color:0xff168e,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false});
 const midMat=new THREE.MeshBasicMaterial({color:0xff35bb,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false});
 const coreMat=new THREE.MeshBasicMaterial({color:0xffe8fb,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false});
 const makeBeam=(radius,length,mat)=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(radius,radius,length,16),mat);m.rotation.x=Math.PI/2;model.add(m);return m};
 const haze=makeBeam(.095,3.2,hazeMat),mid=makeBeam(.052,3.18,midMat),core=makeBeam(.018,3.16,coreMat);
 const headMat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,blending:THREE.AdditiveBlending});
 const head=new THREE.Mesh(new THREE.SphereGeometry(.09,16,12),headMat);model.add(head);
 const muzzleGlow=new THREE.PointLight(0xff168e,0,5);muzzleGlow.position.set(x,-.72,-2.05);model.add(muzzleGlow);
 laserBolts.push({haze,mid,core,head,hazeMat,midMat,coreMat,headMat,muzzleGlow,phase:i*.5,x});
}
// Parametric medusa propulsion appendages: tapered flexible tentacles, animated from their roots.
const tentacleRig=new THREE.Group();tentacleRig.position.set(0,-.72,-1.28);model.add(tentacleRig);
const tentacleMats=[
 new THREE.MeshPhysicalMaterial({color:0x7d155e,metalness:.38,roughness:.16,clearcoat:1,clearcoatRoughness:.035,emissive:0x9c075b,emissiveIntensity:.72,side:THREE.DoubleSide}),
 new THREE.MeshPhysicalMaterial({color:0x087b9b,metalness:.42,roughness:.14,clearcoat:1,clearcoatRoughness:.025,emissive:0x006b9f,emissiveIntensity:.78,side:THREE.DoubleSide}),
 new THREE.MeshPhysicalMaterial({color:0x9a4a28,metalness:.38,roughness:.18,clearcoat:1,emissive:0x9b2c55,emissiveIntensity:.62})
];
const tentacleGlowMats=[
 new THREE.MeshBasicMaterial({color:0xff20bd,transparent:true,opacity:1,blending:THREE.AdditiveBlending,depthWrite:false}),
 new THREE.MeshBasicMaterial({color:0x27eaff,transparent:true,opacity:.96,blending:THREE.AdditiveBlending,depthWrite:false}),
 new THREE.MeshBasicMaterial({color:0xff5b9b,transparent:true,opacity:.95,blending:THREE.AdditiveBlending,depthWrite:false})
];
function taperedTube(points,radii,radial=10){
 const verts=[],indices=[],curve=new THREE.CatmullRomCurve3(points);
 const frames=curve.computeFrenetFrames(36,false);
 for(let i=0;i<=36;i++){
  const u=i/36,p=curve.getPointAt(u),idx=Math.min(radii.length-2,Math.floor(u*(radii.length-1))),f=u*(radii.length-1)-idx;
  const radius=THREE.MathUtils.lerp(radii[idx],radii[idx+1],f);
  for(let j=0;j<radial;j++){const a=j/radial*Math.PI*2,n=new THREE.Vector3().copy(frames.normals[i]).multiplyScalar(Math.cos(a)).addScaledVector(frames.binormals[i],Math.sin(a));const v=p.clone().addScaledVector(n,radius);verts.push(v.x,v.y,v.z)}
 }
 for(let i=0;i<36;i++)for(let j=0;j<radial;j++){const a=i*radial+j,b=i*radial+(j+1)%radial,c=(i+1)*radial+(j+1)%radial,d=(i+1)*radial+j;indices.push(a,b,d,b,c,d)}
 const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));geo.setIndex(indices);geo.computeVertexNormals();return geo;
}
const tentacles=[];
for(let i=0;i<12;i++){
 const angle=i/12*Math.PI*2+(i%2)*.12,side=Math.cos(angle),depth=Math.sin(angle);
 const root=new THREE.Group();root.position.set(side*.34,-.02,depth*.14);tentacleRig.add(root);
 const len=2.25+(i%4)*.38,spread=.58+(i%3)*.25;
 const points=[
  new THREE.Vector3(0,0,0),
  new THREE.Vector3(side*.12,-len*.28,depth*.06),
  new THREE.Vector3(side*spread*.62,-len*.58,depth*.16),
  new THREE.Vector3(side*spread,-len*.82,depth*.22),
  new THREE.Vector3(side*(spread*.65+.18),-len,depth*.10)
 ];
 const main=new THREE.Mesh(taperedTube(points,[.17,.145,.105,.063,.012],12),tentacleMats[i%3]);main.frustumCulled=false;root.add(main);
 const innerPts=points.map((p,k)=>new THREE.Vector3(p.x+(k===0?.02:0),p.y,p.z-.09));
 const filament=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(innerPts),48,.026,8,false),tentacleGlowMats[i%3]);filament.frustumCulled=false;root.add(filament);
 const edgePts=points.map((p,k)=>new THREE.Vector3(p.x+(k===0?-.035:0),p.y,p.z+.055));
 const edgeGlow=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(edgePts),48,.012,6,false),tentacleGlowMats[(i+1)%3]);edgeGlow.frustumCulled=false;root.add(edgeGlow);
 for(let k=1;k<=4;k++){const p=new THREE.CatmullRomCurve3(points).getPointAt(k/5);const bead=new THREE.Mesh(new THREE.SphereGeometry(.035+(1-k/6)*.018,10,8),tentacleGlowMats[(i+k)%3]);bead.position.copy(p);root.add(bead)}
 const tip=new THREE.Mesh(new THREE.SphereGeometry(.045,12,8),tentacleGlowMats[i%3]);tip.position.copy(points[4]);root.add(tip);
 tentacles.push({root,phase:i*1.37,angle,len});
}

let spinning=false,wire=false;document.querySelector('#spin').textContent='Вращение: ВЫКЛ';document.querySelector('#spin').classList.remove('active');
document.querySelector('#spin').onclick=e=>{spinning=!spinning;e.target.textContent='Вращение: '+(spinning?'ВКЛ':'ВЫКЛ');e.target.classList.toggle('active',spinning)};
document.querySelector('#wire').onclick=e=>{wire=!wire;allMats.forEach(m=>m.wireframe=wire);e.target.classList.toggle('active',wire)};
function setView(p){spinning=false;document.querySelector('#spin').textContent='Вращение: ВЫКЛ';document.querySelector('#spin').classList.remove('active');camera.position.set(...p);controls.target.set(0,0,0);controls.update()}
const viewDistance=()=>innerWidth<innerHeight?15:10.5;document.querySelector('#front').onclick=()=>setView([0,0,-viewDistance()]);document.querySelector('#side').onclick=()=>setView([viewDistance(),innerWidth<innerHeight?0:1,0]);document.querySelector('#top').onclick=()=>setView([0,viewDistance(),.01]);
document.querySelector('#detail').oninput=e=>{model.scale.setScalar(+e.target.value/100);document.querySelector('#detailVal').textContent=e.target.value+'%'};
document.querySelector('#light').oninput=e=>{const v=+e.target.value/100;key.intensity=2.4*v;rim.intensity=1.95*v;fill.intensity=26*v;document.querySelector('#lightVal').textContent=e.target.value+'%'};
const clock=new THREE.Clock();function animate(){
 requestAnimationFrame(animate);const dt=clock.getDelta(),t=clock.elapsedTime;
 if(spinning)model.rotation.y+=dt*.22;
 skullGlow.opacity=.72+Math.sin(t*3.4)*.22;
 cranialSpine.material.opacity=.72+Math.sin(t*2.6)*.2;
 for(const e of driveEffects){const pulse=.82+Math.sin(t*8+e.phase)*.16;e.plume.scale.set(1,pulse,1);e.core.scale.y=.86+Math.sin(t*11+e.phase)*.12;e.plumeMat.opacity=.48+Math.sin(t*7+e.phase)*.16;e.coreMat.opacity=.55+Math.sin(t*10+e.phase)*.2}
 for(const b of laserBolts){
 const phase=(t*1.05+b.phase)%1,active=phase<.34,travel=active?phase/.34:0,z=-2.08-travel*3.25;
 b.hazeMat.opacity=active?.22:0;b.midMat.opacity=active?.62:0;b.coreMat.opacity=active?1:0;b.headMat.opacity=active?1:0;
 b.haze.position.set(b.x,-.72,z);b.mid.position.set(b.x,-.72,z);b.core.position.set(b.x,-.72,z);b.head.position.set(b.x,-.72,z-1.62);
 b.muzzleGlow.intensity=active?2.6:0;
}
for(const e of tentacles){
 const wave=t*1.25+e.phase;
 e.root.rotation.z=Math.sin(wave)*.22+Math.sin(wave*.47)*.12;
 e.root.rotation.x=Math.cos(wave*.82)*.17;
 e.root.rotation.y=Math.sin(wave*.66)*.16;
}
 haloGroup.rotation.z=Math.sin(t*.22)*.08;
 cyanRimLight.intensity=19+Math.sin(t*2.1)*4;magentaRimLight.intensity=17+Math.cos(t*1.7)*4;
 controls.update();if(composer)composer.render();else renderer.render(scene,camera)
}animate();
badge.textContent=composer?"WEBGL + BLOOM OK · 12 ЩУПАЛЕЦ":"WEBGL OK · BLOOM FALLBACK";
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));if(composer)composer.setSize(innerWidth,innerHeight);const portrait=innerWidth<innerHeight;model.rotation.z=0;camera.position.set(0,portrait?0:1.2,portrait?-27:-14.5);controls.target.set(0,0,0);controls.update()});
}catch(error){showError(error.stack||error.message||error)}
})();
</script>
