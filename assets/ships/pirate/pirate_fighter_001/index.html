<!doctype html>
<html lang="ru">
<head>

<style>
:root{color-scheme:dark;--line:#ffffff20;--muted:#9aa9b8;--panel:#0a111bdc;--cyan:#75dfff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070a10;color:#edf4f8;font:13px/1.4 Inter,system-ui,-apple-system,Segoe UI,sans-serif}#stage{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}
#brand{position:fixed;z-index:3;top:20px;left:24px;pointer-events:none;text-shadow:0 2px 18px #000}#brand strong{font-size:20px;letter-spacing:.28em;font-weight:500}#brand small{display:block;margin-top:4px;color:#b6c4d0;letter-spacing:.26em;font-size:9px}
.panel{position:fixed;z-index:4;background:linear-gradient(145deg,#121b28e8,#080d15e8);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(14px);box-shadow:0 14px 42px #0008}
#controls{right:18px;top:18px;width:238px;padding:14px}h2{font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:#9db4c5;margin:0 0 12px;font-weight:600}.group{margin:0 0 15px}.buttons{display:flex;gap:6px;flex-wrap:wrap}.buttons button{flex:1;min-width:64px}
button{border:1px solid #ffffff22;background:#182331;color:#dce8ef;border-radius:7px;padding:8px 9px;font:inherit;font-size:11px;cursor:pointer;transition:.18s}button:hover{border-color:#80c9ec;background:#223649}button.active{border-color:#77c8ee;background:#25435a;color:white}

#status{font-size:10px;color:#83d9c0;margin-top:8px;letter-spacing:.08em}#help{position:fixed;z-index:3;bottom:20px;left:24px;color:#aab8c5;font-size:11px;text-shadow:0 2px 8px #000;pointer-events:none}
#views{position:fixed;z-index:4;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:7px;padding:7px;background:#070d16c9;border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(12px)}#views button{min-width:64px}
#presets{position:fixed;z-index:4;right:18px;bottom:18px;display:flex;gap:6px}#presets button{background:#111b27dd}
@media(max-width:700px){#brand{top:12px;left:14px}#brand strong{font-size:15px}#controls{top:auto;right:10px;bottom:66px;width:190px;padding:10px;max-height:48vh;overflow:auto}#controls .group{margin-bottom:8px}#controls label{margin-top:6px}#views{left:10px;right:10px;bottom:10px;transform:none;justify-content:space-between;gap:3px}#views button{min-width:0;flex:1;padding:8px 5px;font-size:10px}#presets{display:none}#help{left:14px;bottom:64px;font-size:9px;max-width:42%}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="brand"><strong>ST★RFALL</strong><small>PIRATE FIGHTER 001 · VOID HUNTER</small></div>
<section id="controls" class="panel">
<h2>Осмотр и материалы</h2>
<div class="group"><div class="buttons"><button id="spin" class="active">⟳ Автообзор</button><button id="wire">Каркас</button><button id="reset">Сброс</button></div></div>
<div class="group">
<label>Масштаб <output id="zoomVal">100%</output></label><input id="zoom" type="range" min="65" max="145" value="100">
<label>Интенсивность света <output id="lightVal">100%</output></label><input id="light" type="range" min="35" max="150" value="100">
<label>Износ корпуса <output id="wearVal">75%</output></label><input id="wear" type="range" min="0" max="100" value="75">
<label>Свечение кабины <output id="glowVal">80%</output></label><input id="glow" type="range" min="0" max="150" value="80">
</div>
<div class="group"><h2>Освещение сцены</h2><div class="buttons"><button data-env="studio" class="active">Студия</button><button data-env="hangar">Ангар</button><button data-env="space">Космос</button></div></div>

</section>
<div id="help">Мышь / палец — вращение · колесо / щипок — масштаб · правый клик — перемещение</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(()=> {
const status=document.querySelector('#status');
const fail=e=>{status.textContent='ОШИБКА: '+(e.message||e);status.style.color='#ff8b8b'};
window.addEventListener('error',e=>{if(e.message)fail(e.message)});
try{
if(!window.THREE||!THREE.OrbitControls)throw Error('Не удалось загрузить Three.js r128 / OrbitControls. Проверьте доступ к CDN.');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x080d15);scene.fog=new THREE.Fog(0x080d15,22,65);
const portrait=()=>innerHeight>innerWidth;const camera=new THREE.PerspectiveCamera(37,innerWidth/innerHeight,.1,150);camera.position.set(0,portrait()?1.1:1.6,portrait()?16.5:13.4);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.18;document.querySelector('#stage').appendChild(renderer.domElement);
const orbit=new THREE.OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.dampingFactor=.07;orbit.minDistance=5;orbit.maxDistance=30;orbit.target.set(0,0,0);orbit.enablePan=true;orbit.panSpeed=.55;
scene.add(new THREE.HemisphereLight(0xc5d9ef,0x171923,1.35));
const key=new THREE.DirectionalLight(0xffe7d2,3.0);key.position.set(-6,8,10);scene.add(key);
const fill=new THREE.DirectionalLight(0x8cbcff,1.7);fill.position.set(7,2,5);scene.add(fill);
const rim=new THREE.DirectionalLight(0x4acbff,2.8);rim.position.set(2,5,-8);scene.add(rim);
const red=new THREE.PointLight(0xff315e,22,12);red.position.set(0,1,2);scene.add(red);
const cyan=new THREE.PointLight(0x29cfff,18,14);cyan.position.set(-5,-1,-1);scene.add(cyan);
const floor=new THREE.Mesh(new THREE.CircleGeometry(28,64),new THREE.MeshStandardMaterial({color:0x111a25,metalness:.55,roughness:.42}));floor.rotation.x=-Math.PI/2;floor.position.y=-5.1;scene.add(floor);
const grid=new THREE.GridHelper(50,50,0x263b50,0x182737);grid.position.y=-5.08;scene.add(grid);
const starGeo=new THREE.BufferGeometry(),starArr=[];for(let i=0;i<900;i++){let r=24+Math.random()*35,a=Math.random()*Math.PI*2,b=Math.acos(2*Math.random()-1);starArr.push(r*Math.sin(b)*Math.cos(a),r*Math.cos(b),r*Math.sin(b)*Math.sin(a))}starGeo.setAttribute('position',new THREE.Float32BufferAttribute(starArr,3));const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xc3d9ed,size:.095}));scene.add(stars);
const ship=new THREE.Group();scene.add(ship);ship.rotation.z=portrait()?Math.PI/2:0;
const mats=[];
function mat(color,metal=.35,rough=.5,extra={}){const m=new THREE.MeshStandardMaterial({color,metalness:metal,roughness:rough,...extra});mats.push(m);return m}
const enamel=mat(0xd7d7ce,.48,.48),edge=mat(0x69747a,.82,.32),steel=mat(0xaeb8b9,.88,.24),dark=mat(0x171d24,.58,.55),black=mat(0x070b11,.3,.5),rubber=mat(0x252b30,.12,.82);
const iridescent=new THREE.MeshPhysicalMaterial({color:0xffffff,metalness:.82,roughness:.19,clearcoat:1,clearcoatRoughness:.035,reflectivity:1,emissive:0x101c3d,emissiveIntensity:.28});mats.push(iridescent);
const glass=new THREE.MeshPhysicalMaterial({color:0x9beaff,metalness:.08,roughness:.045,transparent:true,opacity:.27,clearcoat:1,clearcoatRoughness:.015,side:THREE.DoubleSide,depthWrite:false});mats.push(glass);
const cyanMat=mat(0x57dfff,.25,.22,{emissive:0x0a9fc9,emissiveIntensity:1.8});
const redMat=mat(0xff405d,.25,.25,{emissive:0x9b1028,emissiveIntensity:1.7});
const cockpit=new THREE.Group();ship.add(cockpit);
function sphere(parent,pos,scale,material,seg=32){const o=new THREE.Mesh(new THREE.SphereGeometry(1,seg,Math.max(12,seg/2)),material);o.position.set(...pos);o.scale.set(...scale);parent.add(o);return o}
function box(parent,pos,size,material,bevel=0){const geo=new THREE.BoxGeometry(...size);const o=new THREE.Mesh(geo,material);o.position.set(...pos);parent.add(o);return o}
function rod(parent,a,b,r,material,radial=12){const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),d=B.clone().sub(A);const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),radial),material);o.position.copy(A.add(B).multiplyScalar(.5));o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());parent.add(o);return o}
function ring(parent,r,t,pos,material,axis='z'){const o=new THREE.Mesh(new THREE.TorusGeometry(r,t,12,80),material);o.position.set(...pos);if(axis==='x')o.rotation.x=Math.PI/2;if(axis==='y')o.rotation.y=Math.PI/2;parent.add(o);return o}
function makeWearTexture(){const c=document.createElement('canvas');c.width=c.height=1024;const x=c.getContext('2d');x.fillStyle='#d7d7ce';x.fillRect(0,0,1024,1024);let seed=773;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
for(let i=0;i<22000;i++){const a=.025+rnd()*.22;x.fillStyle=rnd()>.5?'rgba(255,255,255,'+a+')':'rgba(22,27,30,'+a+')';x.fillRect(rnd()*1024,rnd()*1024,1+rnd()*4,1+rnd()*3)}
for(let i=0;i<230;i++){x.save();x.translate(rnd()*1024,rnd()*1024);x.rotate((rnd()-.5)*.8);x.strokeStyle=rnd()>.45?'rgba(255,255,245,.8)':'rgba(28,32,34,.75)';x.lineWidth=.7+rnd()*2.3;x.beginPath();x.moveTo(0,0);x.lineTo(8+rnd()*95,0);x.stroke();x.restore()}
for(let i=0;i<90;i++){x.fillStyle='rgba(49,35,27,'+(.04+rnd()*.13)+')';x.beginPath();x.ellipse(rnd()*1024,rnd()*1024,5+rnd()*25,2+rnd()*9,rnd(),0,Math.PI*2);x.fill()}
return new THREE.CanvasTexture(c)}
const wearMap=makeWearTexture();wearMap.encoding=THREE.sRGBEncoding;enamel.map=wearMap;enamel.needsUpdate=true;
function makeScales(){const c=document.createElement('canvas');c.width=1024;c.height=512;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,1024,512);[['#08142b',0],['#087d91',.25],['#2e6c92',.42],['#9b3f79',.62],['#d49a42',.79],['#123c68',1]].forEach(v=>g.addColorStop(v[1],v[0]));x.fillStyle=g;x.fillRect(0,0,1024,512);
for(let y=-20;y<550;y+=22)for(let xx=-15;xx<1050;xx+=26){const px=xx+(Math.floor(y/22)%2)*13,h=(190+px/1024*125+y/512*35)%360;x.beginPath();x.ellipse(px,y,19,15,.04,0,Math.PI*2);x.fillStyle='hsla('+h+',76%,48%,.42)';x.fill();x.strokeStyle='hsla('+h+',90%,78%,.95)';x.lineWidth=3;x.stroke();x.beginPath();x.ellipse(px-5,y-5,9,3,-.45,0,Math.PI*2);x.fillStyle='rgba(255,255,255,.42)';x.fill()}
for(let i=0;i<2200;i++){x.fillStyle=Math.random()>.5?'rgba(255,255,255,.2)':'rgba(0,0,0,.3)';x.fillRect(Math.random()*1024,Math.random()*512,1+Math.random()*2,1+Math.random()*2)}return new THREE.CanvasTexture(c)}
const scaleMap=makeScales();scaleMap.encoding=THREE.sRGBEncoding;iridescent.map=scaleMap;iridescent.needsUpdate=true;
// Armored central sphere and forward-facing canopy.
sphere(ship,[0,0,0],[1.42,1.42,1.25],iridescent,80);
ring(ship,1.31,.055,[0,0,.05],steel);ring(ship,1.37,.025,[0,0,-.02],edge);
const canopy=new THREE.Mesh(new THREE.SphereGeometry(1.12,64,48,0,Math.PI*2,0,Math.PI*.58),glass);canopy.position.set(0,0,.68);canopy.rotation.x=-Math.PI/2;ship.add(canopy);
const innerGlow=new THREE.Mesh(new THREE.SphereGeometry(1.08,48,32,0,Math.PI*2,0,Math.PI*.58),new THREE.MeshBasicMaterial({color:0x25bfe9,transparent:true,opacity:.16,side:THREE.DoubleSide,depthWrite:false}));innerGlow.position.copy(canopy.position);innerGlow.rotation.copy(canopy.rotation);ship.add(innerGlow);
ring(ship,1.10,.045,[0,0,.68],steel);
for(let i=0;i<12;i++){const a=i/12*Math.PI*2;const p=sphere(ship,[Math.cos(a)*1.12,Math.sin(a)*1.12,.68],[.045,.045,.045],i%3?steel:redMat,12)}
// Pilot: dark armored flight suit, angular helmet and a narrow red visor.
const pilot=new THREE.Group();pilot.position.set(0,-.03,.88);ship.add(pilot);
sphere(pilot,[0,-.22,-.06],[.43,.58,.36],black,32);sphere(pilot,[0,.30,.02],[.39,.43,.36],dark,40);
sphere(pilot,[0,.78,.08],[.36,.39,.34],black,40);
const helmetFace=new THREE.Mesh(new THREE.ConeGeometry(.23,.45,5),dark);helmetFace.position.set(0,.55,.38);helmetFace.rotation.x=Math.PI/2;pilot.add(helmetFace);
box(pilot,[0,.78,.385],[.52,.105,.055],redMat);
for(const s of [-1,1]){sphere(pilot,[s*.35,.68,.05],[.14,.25,.24],steel,20);rod(pilot,[s*.28,.22,.02],[s*.42,-.30,.26],.105,black);}
// Chest harness and seat details visible through canopy.
box(pilot,[0,-.18,.31],[.52,.16,.05],edge);for(const s of [-1,1])rod(pilot,[s*.18,.04,.34],[s*.03,-.35,.35],.025,steel);
box(ship,[0,0,-.85],[1.55,1.7,.12],dark);box(ship,[0,.0,-.94],[1.28,1.42,.05],black);
// Wing graphics texture: skull-and-crossbones, graffiti and weathering baked into enamel.
function wingTexture(side){const c=document.createElement('canvas');c.width=768;c.height=1024;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,768,1024);g.addColorStop(0,'#efeee5');g.addColorStop(.5,'#c9c9bf');g.addColorStop(1,'#777e82');x.fillStyle=g;x.fillRect(0,0,768,1024);
for(let i=0;i<12500;i++){const a=Math.random()*.18;x.fillStyle=Math.random()>.5?'rgba(255,255,255,'+a+')':'rgba(10,15,18,'+a+')';x.fillRect(Math.random()*768,Math.random()*1024,1+Math.random()*4,1+Math.random()*3)}
// chipped paint and red-brown streaks
for(let i=0;i<130;i++){const px=Math.random()*768,py=Math.random()*1024;x.strokeStyle=Math.random()>.5?'rgba(44,48,49,.75)':'rgba(142,48,34,.55)';x.lineWidth=1+Math.random()*5;x.beginPath();x.moveTo(px,py);x.lineTo(px+(Math.random()-.5)*28,py+8+Math.random()*75);x.stroke()}
x.strokeStyle='#30383e';x.lineWidth=28;x.strokeRect(28,28,712,968);x.strokeStyle='#a5aaa6';x.lineWidth=7;x.strokeRect(48,48,672,928);
// Skull and crossbones graphic
x.save();x.translate(384,340);x.strokeStyle='#202529';x.fillStyle='#e4e1d5';x.lineWidth=18;
for(const a of [-.68,.68]){x.save();x.rotate(a);x.lineWidth=28;x.beginPath();x.moveTo(0,-220);x.lineTo(0,220);x.stroke();for(const y of [-220,220]){x.beginPath();x.arc(0,y,28,0,Math.PI*2);x.fill();x.stroke()}x.restore()}
x.beginPath();x.moveTo(-135,-80);x.quadraticCurveTo(-170,-250,0,-255);x.quadraticCurveTo(170,-250,135,-80);x.lineTo(105,95);x.quadraticCurveTo(80,150,50,165);x.lineTo(42,210);x.lineTo(-42,210);x.lineTo(-50,165);x.quadraticCurveTo(-80,150,-105,95);x.closePath();x.fill();x.stroke();
x.fillStyle='#171c20';x.beginPath();x.ellipse(-62,-60,42,62,-.15,0,Math.PI*2);x.ellipse(62,-60,42,62,.15,0,Math.PI*2);x.fill();x.beginPath();x.moveTo(0,-8);x.lineTo(-22,42);x.lineTo(22,42);x.closePath();x.fill();x.fillRect(-68,128,136,48);for(let i=-3;i<=3;i++)x.fillRect(i*19-3,128,6,48);x.restore();
x.save();x.translate(385,770);x.rotate(-.13);x.fillStyle='#171d21';x.strokeStyle='#c7c4b9';x.lineWidth=7;x.textAlign='center';x.font='bold 76px Impact, sans-serif';x.strokeText(side<0?'FUCK THE':'NO RULES',0,0);x.fillText(side<0?'FUCK THE':'NO RULES',0,0);x.font='bold 62px Impact, sans-serif';x.strokeText(side<0?'EMPIRE':'NO MERCY',0,78);x.fillText(side<0?'EMPIRE':'NO MERCY',0,78);x.restore();
for(let i=0;i<100;i++){x.fillStyle=Math.random()>.5?'rgba(25,30,32,.3)':'rgba(255,255,255,.32)';x.fillRect(Math.random()*768,Math.random()*1024,2+Math.random()*12,1+Math.random()*4)}
return new THREE.CanvasTexture(c)}
function wing(side){const group=new THREE.Group();group.position.set(side*3.55,0,0);ship.add(group);const w=2.8,h=3.85,pts=[[-.34*w,.5*h],[.34*w,.5*h],[.5*w,.29*h],[.5*w,-.29*h],[.34*w,-.5*h],[-.34*w,-.5*h],[-.5*w,-.29*h],[-.5*w,.29*h]];
const shape=new THREE.Shape();shape.moveTo(...pts[0]);pts.slice(1).forEach(p=>shape.lineTo(...p));shape.closePath();const geo=new THREE.ExtrudeGeometry(shape,{depth:.16,bevelEnabled:true,bevelThickness:.055,bevelSize:.045,bevelSegments:3});
const tex=wingTexture(side);tex.encoding=THREE.sRGBEncoding;tex.anisotropy=8;const paint=new THREE.MeshPhysicalMaterial({map:tex,color:0xffffff,metalness:.2,roughness:.72,clearcoat:.25,side:THREE.DoubleSide});mats.push(paint);
const plate=new THREE.Mesh(geo,paint);plate.position.z=-.08;group.add(plate);
const ribMat=mat(0x222a30,.75,.48);const innerPts=pts.map(([x,y])=>[x*.86,y*.86]);for(let i=0;i<pts.length;i++)rod(group,[...pts[i],.10],[...pts[(i+1)%pts.length],.10],.055,steel,10);
for(let i=0;i<innerPts.length;i++)rod(group,[...innerPts[i],-.01],[...innerPts[(i+1)%innerPts.length],-.01],.045,edge,10);
box(group,[0,0,-.16],[.16,h*.78,.11],dark);for(let y=-1;y<=1;y++)box(group,[0,y*1.2,-.17],[w*.72,.055,.12],ribMat);
for(let x=-1;x<=1;x+=2)for(let y of [-1,1])sphere(group,[x*1.15,y*1.55,.15],[.055,.055,.035],steel,12);
for(let i=0;i<18;i++){const px=(Math.random()-.5)*w*.8,py=(Math.random()-.5)*h*.82;const scratch=box(group,[px,py,.17],[.04+Math.random()*.18,.009,.009],i%3?edge:steel);scratch.rotation.z=(Math.random()-.5)*.55}

wing(-1);wing(1);
// Exposed mechanical shoulder joints and connecting spars.
for(const s of [-1,1]){rod(ship,[s*1.05,.48,0],[s*3.55,.48,0],.16,steel);rod(ship,[s*1.05,-.48,0],[s*3.55,-.48,0],.13,edge);sphere(ship,[s*1.12,0,0],[.3,.42,.34],steel);sphere(ship,[s*3.45,0,0],[.24,.32,.27],edge);
for(let k=0;k<5;k++){const x=s*(1.5+k*.34);rod(ship,[x,-.56,-.05],[x,-.56,-.42],.035,steel,8)}}
// Twin forward laser cannons, armored and machined.
for(const s of [-1,1]){const x=s*.53,y=-.78;rod(ship,[x,y,.7],[x,y,1.38],.13,edge);rod(ship,[x,y,1.3],[x,y,1.75],.09,steel);ring(ship,.13,.025,[x,y,1.45],steel,'y');sphere(ship,[x,y,1.79],[.105,.105,.105],redMat,16);}
// Rear twin engines, no tentacles or extraneous appendages.
for(const s of [-1,1]){const x=s*.52;rod(ship,[x,0,-.82],[x,0,-1.72],.26,edge);ring(ship,.24,.045,[x,0,-1.68],steel);sphere(ship,[x,0,-1.75],[.17,.17,.07],cyanMat,24);const plume=new THREE.Mesh(new THREE.ConeGeometry(.18,1.05,24,1,true),new THREE.MeshBasicMaterial({color:s<0?0x3beaff:0x9b76ff,transparent:true,opacity:.48,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,depthWrite:false}));plume.rotation.x=Math.PI/2;plume.position.set(x,0,-2.25);ship.add(plume);}
for(let i=0;i<24;i++){const a=i/24*Math.PI*2;const lamp=sphere(ship,[Math.cos(a)*1.34,Math.sin(a)*1.34,.1],[.025,.025,.025],i%2?cyanMat:redMat,10)}
// Cockpit illumination and a subtle energy halo.
const cabinLamp=new THREE.PointLight(0x37cfff,2.8,4);cabinLamp.position.set(0,.15,1.2);ship.add(cabinLamp);
const halo=ring(ship,1.65,.012,[0,0,-.35],new THREE.MeshBasicMaterial({color:0x2fcfff,transparent:true,opacity:.45,blending:THREE.AdditiveBlending,depthWrite:false}));halo.rotation.x=.2;
const shadow=new THREE.Mesh(new THREE.CircleGeometry(3.7,48),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.25,depthWrite:false}));shadow.rotation.x=-Math.PI/2;shadow.position.set(0,-4.95,0);scene.add(shadow);
let auto=true,wire=false,env='studio',lightPower=1,wear=0.75,glowPower=.8;
function setEnv(name){env=name;scene.background=new THREE.Color(name==='space'?0x02040a:name==='hangar'?0x11151b:0x080d15);scene.fog.color.copy(scene.background);floor.visible=name!=='space';grid.visible=name==='hangar';stars.visible=name==='space';key.intensity=(name==='hangar'?2.0:3.0)*lightPower;fill.intensity=(name==='space'?.8:name==='hangar'?2.3:1.7)*lightPower;rim.intensity=(name==='space'?3.3:2.8)*lightPower;red.intensity=(name==='hangar'?12:22)*lightPower;cyan.intensity=(name==='space'?26:18)*lightPower;document.querySelectorAll('[data-env]').forEach(b=>b.classList.toggle('active',b.dataset.env===name))}
document.querySelectorAll('[data-env]').forEach(b=>b.onclick=()=>setEnv(b.dataset.env));
document.querySelector('#spin').onclick=e=>{auto=!auto;e.currentTarget.classList.toggle('active',auto);e.currentTarget.textContent=auto?'⟳ Автообзор':'⟳ Вращение: выкл'};
document.querySelector('#wire').onclick=e=>{wire=!wire;mats.forEach(m=>m.wireframe=wire);e.currentTarget.classList.toggle('active',wire)};
document.querySelector('#zoom').oninput=e=>{ship.scale.setScalar(+e.target.value/100);document.querySelector('#zoomVal').textContent=e.target.value+'%'};
document.querySelector('#light').oninput=e=>{lightPower=+e.target.value/100;document.querySelector('#lightVal').textContent=e.target.value+'%';setEnv(env)};
document.querySelector('#wear').oninput=e=>{wear=+e.target.value/100;document.querySelector('#wearVal').textContent=e.target.value+'%';enamel.roughness=.25+wear*.4;enamel.color.setRGB(1-.12*wear,1-.12*wear,1-.1*wear);mats.filter(m=>m.map&&m.map!==scaleMap).forEach(m=>{if(m!==enamel)m.roughness=.9-wear*.18})};
document.querySelector('#glow').oninput=e=>{glowPower=+e.target.value/100;document.querySelector('#glowVal').textContent=e.target.value+'%';cabinLamp.intensity=2.8*glowPower;innerGlow.material.opacity=.16*glowPower;cyanMat.emissiveIntensity=1.8*glowPower;redMat.emissiveIntensity=1.7*glowPower};
const viewPosition=k=>{const d=portrait()?16.5:13.4;return {front:[0,1.1,d],rear:[0,1.1,-d],side:[d,1,0],top:[0,d,.01],bottom:[0,-d,.01]}[k]};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{auto=false;document.querySelector('#spin').classList.remove('active');document.querySelector('#spin').textContent='⟳ Вращение: выкл';camera.position.set(...viewPosition(b.dataset.view));orbit.target.set(0,0,0);orbit.update()});
document.querySelector('#reset').onclick=()=>{ship.scale.setScalar(1);document.querySelector('#zoom').value=100;document.querySelector('#zoomVal').textContent='100%';camera.position.set(0,portrait()?1.1:1.6,portrait()?16.5:13.4);orbit.target.set(0,0,0);ship.rotation.z=portrait()?Math.PI/2:0;orbit.update();ship.rotation.set(0,0,0);auto=true;document.querySelector('#spin').classList.add('active');document.querySelector('#spin').textContent='⟳ Автообзор'};
setEnv('studio');status.textContent='МОДЕЛЬ ЗАГРУЖЕНА · 3D ENGINE OK';
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04),t=clock.elapsedTime;if(auto)ship.rotation.y+=dt*.18;red.intensity=(env==='hangar'?12:22)*lightPower*(.92+Math.sin(t*1.7)*.08);cabinLamp.intensity=2.8*glowPower*(.9+Math.sin(t*2.4)*.1);orbit.update();renderer.render(scene,camera)}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));ship.rotation.z=portrait()?Math.PI/2:0;camera.position.set(0,portrait()?1.1:1.6,portrait()?16.5:13.4);orbit.target.set(0,0,0);orbit.update()});
}catch(e){fail(e)}
})();
</script>
</body></html>
