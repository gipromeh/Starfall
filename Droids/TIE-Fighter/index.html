 }

 for(let k=0;k<4;k++){const stripe=new THREE.Mesh(new THREE.BoxGeometry(.18,.025,.012),marking);stripe.position.set(-.78+k*.12,-1.63,-.15);g.add(stripe)}
 rod(g,[0,-h*.43,-.13],[0,h*.43,-.13],.035,edge);
 // Colored structural ribs and painted service bands.
 rod(g,[-w*.34,0,-.14],[w*.34,0,-.14],.045,edge);
 rod(g,[-w*.34,h*.31,-.14],[w*.34,h*.31,-.14],.032,bright);
 rod(g,[-w*.34,-h*.31,-.14],[w*.34,-h*.31,-.14],.032,bright);
 for(let k=0;k<5;k++){const stripe=new THREE.Mesh(new THREE.BoxGeometry(.055,.48,.018),k%2?amber:signalRed);stripe.position.set(-1.12+k*.12,1.28,-.155);g.add(stripe)}

 // Colored position beacon at the outer wing tip.
 const beacon=new THREE.Mesh(new THREE.SphereGeometry(.105,12,8),side<0?emissiveRed:emissiveCyan);beacon.position.set(side<0?-1.48:1.48,0,-.16);g.add(beacon);
 for(let y=-1;y<=1;y+=.5)rod(g,[-w*.39,y*h*.36,-.13],[w*.39,y*h*.36,-.13],.025,edge);
 for(const x of [-1,1]){rod(g,[0,0,-.14],[x*w*.39,h*.36,-.14],.026,edge);rod(g,[0,0,-.14],[x*w*.39,-h*.36,-.14],.026,edge)}

const tentacleRig=new THREE.Group();tentacleRig.position.set(0,-.66,.12);model.add(tentacleRig);
const tentacleMats=[
 new THREE.MeshPhysicalMaterial({color:0x25113e,metalness:.42,roughness:.22,clearcoat:1,clearcoatRoughness:.08,emissive:0x26004a,emissiveIntensity:.34}),
 new THREE.MeshPhysicalMaterial({color:0x142d43,metalness:.38,roughness:.2,clearcoat:1,emissive:0x062c58,emissiveIntensity:.38}),
 new THREE.MeshPhysicalMaterial({color:0x35142f,metalness:.36,roughness:.24,clearcoat:1,emissive:0x4a0730,emissiveIntensity:.38})
];
const tentacleGlowMats=[
 new THREE.MeshBasicMaterial({color:0xff39b8,transparent:true,opacity:.9,blending:THREE.AdditiveBlending}),
 new THREE.MeshBasicMaterial({color:0x36dfff,transparent:true,opacity:.85,blending:THREE.AdditiveBlending}),
 new THREE.MeshBasicMaterial({color:0xffa14b,transparent:true,opacity:.85,blending:THREE.AdditiveBlending})
];
function taperedTube(points,radii,radial=10){
 const verts=[],indices=[],curve=new THREE.CatmullRomCurve3(points);
 const frames=curve.computeFrenetFrames(36,false);
 for(let i=0;i<=36;i++){
  const u=i/36,p=curve.getPointAt(u),idx=Math.min(radii.length-2,Math.floor(u*(radii.length-1))),f=u*(radii.length-1)-idx;
  const radius=THREE.MathUtils.lerp(radii[idx],radii[idx+1],f);
  for(let j=0;j<radial;j++){const a=j/radial*Math.PI*2,n=new THREE.Vector3().copy(frames.normals[i]).multiplyScalar(Math.cos(a)).addScaledVector(frames.binormals[i],Math.sin(a));const v=p.clone().addScaledVector(n,radius);verts.push(v.x,v.y,v.z)}
 }
 for(let i=0;i<36;i++)for(let j=0;j<radial;j++){const a=i*radial+j,b=i*radial+(j+1)%radial,c=(i+1)*radial+(j+1)%radial,d=(i+1)*radial+j;indices.push(a,b,d,b,c,d)}
 const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));geo.setIndex(indices);geo.computeVertexNormals();return geo;
}
const tentacles=[];

  new THREE.Vector3(0,0,0),
  new THREE.Vector3(side*.12,-len*.28,depth*.12),
  new THREE.Vector3(side*spread*.62,-len*.58,depth*.35),
  new THREE.Vector3(side*spread,-len*.82,depth*.48),
  new THREE.Vector3(side*(spread*.65+.18),-len,depth*.26)
 ];
 const main=new THREE.Mesh(taperedTube(points,[.17,.145,.105,.063,.012],12),tentacleMats[i%3]);root.add(main);
 const innerPts=points.map((p,k)=>new THREE.Vector3(p.x+(k===0?.02:0),p.y,p.z-.035));
 const filament=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(innerPts),40,.018,7,false),tentacleGlowMats[i%3]);root.add(filament);
 for(let k=1;k<=4;k++){const p=new THREE.CatmullRomCurve3(points).getPointAt(k/5);const bead=new THREE.Mesh(new THREE.SphereGeometry(.035+(1-k/6)*.018,10,8),tentacleGlowMats[(i+k)%3]);bead.position.copy(p);root.add(bead)}

 tentacles.push({root,phase:i*1.37,angle,len});
}

const clock=new THREE.Clock();function animate(){
 requestAnimationFrame(animate);const dt=clock.getDelta(),t=clock.elapsedTime;
 if(spinning)model.rotation.y+=dt*.22;
 for(const e of driveEffects){const pulse=.82+Math.sin(t*8+e.phase)*.16;e.plume.scale.set(1,pulse,1);e.core.scale.y=.86+Math.sin(t*11+e.phase)*.12;e.plumeMat.opacity=.48+Math.sin(t*7+e.phase)*.16;e.coreMat.opacity=.55+Math.sin(t*10+e.phase)*.2}
 for(const b of laserBolts){

 b.hazeMat.opacity=active?.22:0;b.midMat.opacity=active?.62:0;b.coreMat.opacity=active?1:0;b.headMat.opacity=active?1:0;
 b.haze.position.set(b.x,-.72,z);b.mid.position.set(b.x,-.72,z);b.core.position.set(b.x,-.72,z);b.head.position.set(b.x,-.72,z-1.62);

}
for(const e of tentacles){

}animate();
