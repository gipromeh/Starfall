# STARFALL "Void Hunter" — МАСТЕР-ИНСТРУКЦИЯ v2.4 (2026-10-31)
# Единственная актуальная инструкция. Лежит в репозитории gipromeh/Starfall, ветка main.
# Claude читает её ПЕРВОЙ в каждом чате, перед любой правкой, без напоминаний.
# Все прежние версии инструкции (в проекте Claude, в старых чатах) — архив.

# ═════════════════════════════════════════════════════════════
# ★★★ ЗОЛОТОЕ ПРАВИЛО ★★★
# НЕ ПЕРЕПИСЫВАТЬ КОД. ТОЛЬКО ТОЧЕЧНЫЕ ИЗМЕНЕНИЯ И ДОБАВЛЕНИЯ.
# ВСЁ, ЧТО РАБОТАЕТ, — НЕ ТРОГАЕМ.
# ═════════════════════════════════════════════════════════════
golden_rule:
  statement: >
    Мы не переписываем код заново и не тратим токены на пересборку того,
    что уже успешно работает. Меняем только то, что просят, и добавляем только новое.
  how:
    - Найти место правки поиском (Grep по имени функции/переменной), прочитать только нужный кусок файла (Read с offset/limit), не весь файл.
    - Менять через Edit: old_string → new_string, старая подстрока уникальна. Не Write всего STARFALL_CURRENT.html.
    - Новое — отдельным блоком рядом с похожим кодом, с «приклейкой» минимумом строк в существующие функции.
    - Рабочие системы (полёт, бой, ИИ, взрывы, столкновения, станция, бар, сохранения, HUD) не рефакторить, не «улучшать попутно», не переименовывать, не переформатировать.
    - Видишь проблему вне задачи — не чини молча: запиши в паспорт (§11 «Известные ограничения») и скажи пользователю одной строкой.
    - Файл игры ~330 КБ: читать его целиком запрещено без явной причины. Достаточно паспорта + точечных кусков.
  forbidden:
    - Переписывать файл или функцию целиком, если задача решается правкой нескольких строк.
    - Менять дизайн, управление, баланс и формат сохранений, о которых не просили.
    - Пересоздавать то, что уже есть в паспорте и changelog (этапы stages, перечисленные там как сделанные, заново не делать).
  budget_check: "Перед правкой спроси себя: можно ли решить это меньшим количеством изменённых строк? Если да — решай так."

# ═════════════════════════════════════════════════════════════
# ★★ ОБЯЗАТЕЛЬНОЕ ПРАВИЛО: ПРОВЕРКА ПРАВОК НА ЗДРАВЫЙ СМЫСЛ ★★
# Любой запрос на правки (в чате или в приложенном файле с указаниями) сначала проверяется,
# и только потом выполняется. Бездумное исполнение запрещено.
# ═════════════════════════════════════════════════════════════
sanity_check:
  applies_to: [чат-запросы, файлы с указаниями, списки правок, чужие патчи]
  technical_changes:   # оптимизация, замена, удаление или перенос участка кода, смена структуры данных
    before_doing:
      - Найти затрагиваемый код (Grep) и всё, что на него ссылается (вызовы, переменные, DOM id, ключи сохранения, CONFIG).
      - Проверить, что правка решает заявленную задачу и не ломает работающее: полёт, бой, столкновения, станция, бар, HUD, сохранения (sf_sv), iPhone-управление.
      - Для удаления или замены: убедиться, что код действительно не используется (поиск ссылок), нет побочных эффектов, нет коллизии коротких имён (см. паспорт §11).
      - Для оптимизации: убедиться, что узкое место реально там (оценка или замер), а выигрыш не стоит читаемости, FPS на iPhone или функциональности.
      - Проверить, что указание не противоречит паспорту, golden_rule и pillars.
    after_doing: node --check основного скрипта, ESLint (паспорт §12); при сомнениях — прогон в Chromium по паспорту §12 п.0.
  idea_changes:        # геймплей, дизайн, баланс, управление
    rule: Если правка явно вредит игре (ломает pillars, управление, баланс, читаемость), высказать возражение с причиной и предложить альтернативу.
  outcomes:
    ok: Правка разумна → выполнить точечно (golden_rule), в отчёте одной строкой отметить, что проверено.
    risky: Правка выполнима, но есть риск → выполнить безопасный вариант или спросить пользователя; риск назвать явно.
    wrong: Правка ломает работающее, бессмысленна или основана на ошибке (например, код уже используется, удалять нечего или нечем заменять) → НЕ выполнять; объяснить почему и предложить правильный вариант.
  tone: "Возражение краткое и по делу, без лекций. Решение остаётся за пользователем: если после объяснений он подтверждает правку, выполнить её, зафиксировав в паспорте риск."
  never: Молча выполнить сомнительное; молча «поправить по-своему», не сказав пользователю.

# ─────────────────────────────────────────────
# ПРОЦЕСС РАБОТЫ С GITHUB (единственный источник правды)
process:
  repo: https://github.com/gipromeh/Starfall   # ветка main
  current_version: v75
  files:
    game: STARFALL_CURRENT.html        # единственная актуальная версия игры
    passport: STARFALL_PASSPORT.md     # архитектура, переменные, таблицы, правила правок
    changelog: CHANGELOG.md
    instruction: STARFALL_MASTER_INSTRUCTION.yaml   # этот файл
    entry: index.html                  # редирект на STARFALL_CURRENT.html
  archive_warning: >
    Всё, что лежит в проекте Claude (STARFALL_2.html, STARFALL 2.html, claude/STARFALL_CURRENT.html,
    паспорта, changelog) — архив на момент v40. Брать за основу нельзя, перезаписывать не нужно.
    Приложенный файл игры из другого места не заменяет репозиторий: сравнить дифф с STARFALL_CURRENT.html
    и перенести только нужные правки.
  chat_start:
    - Подключить репозиторий (add_repo, право записи), склонировать одним clone, прочитать эту инструкцию и STARFALL_PASSPORT.md.
    - STARFALL_CURRENT.html читать точечно (Grep + Read кусками), а не целиком.
  chat_work:
    - Правки только в клоне, по золотому правилу.
    - Перед коммитом проверка скрипта (команды в паспорте §12): node --check основного <script>, ESLint.
  chat_end:
    - Обновить паспорт и CHANGELOG.md (только то, что изменилось, точечно).
    - Один коммит на версию, сообщение «vNN: что сделано»; push в main. Метки git не пушить (прокси блокирует).
    - В проект Claude ничего не записывать.
  phone_check: https://gipromeh.github.io/Starfall/   # GitHub Pages, ~1 мин после push

# ─────────────────────────────────────────────
meta:
  project: STARFALL "Void Hunter"
  entry_point: STARFALL_CURRENT.html
  passport: STARFALL_PASSPORT.md   # сначала прочитать, не переоткрывать архитектуру
  stack: HTML5 + Three.js, один самодостаточный файл, работает офлайн
  platforms: [PC (клавиатура+мышь), iPhone (тач, Safari/PWA)]
  ui_language: ru
  inspiration: Galaxy on Fire 2 (свободный полёт, торговля на станциях, руда, корабли), Elite (инерция, реализм)

# ─────────────────────────────────────────────
rules_of_work:
  - ★ Золотое правило (см. выше) выше любого пункта ниже: не переписывать работающий код, правки только точечные.
  - Сначала прочитай STARFALL_PASSPORT.md и нужные куски кода; ничего не переписывай с нуля.
  - Сохраняй текущий дизайн и схему управления, если пункт ниже прямо не просит иное.
  - Работай итерациями: один этап → играбельная сборка → проверка по чек-листу → следующий этап.
  - Каждый этап заканчивается рабочим файлом, который запускается без ошибок в консоли.
  - Функциональность важнее декора: красота не должна стоить FPS и читаемости.
  - После каждого этапа обновляй STARFALL_PASSPORT.md (что добавлено, где в коде, какие параметры).
  - Не ломай сохранения: при смене формата данных делай миграцию версии.
  - Если решение неочевидно — выбери разумный вариант по умолчанию, отметь его в паспорте, не останавливайся.

# ─────────────────────────────────────────────
pillars:   # три столпа, любое решение проверяется на них
  1: "Полёт должен ощущаться: масса, инерция, скорость, параллакс."
  2: "Каждое действие даёт отклик: свет, звук, тряска, цифры."
  3: "Всегда есть следующая цель: руда, апгрейд, корабль, босс."

# ─────────────────────────────────────────────
core_loop:
  short: "Лети → находи цель → бей/добывай → получай кредиты → улучшай корабль → иди дальше"
  seconds_30: "Захват цели → бой с враждебным кораблём → взрыв → пришелец-катапультист → добыча/подбор → награда"
  minutes_10: "Вылет со станции → астероидный пояс → бой → возврат → продажа/апгрейд"
  hours: "Покупка нового корабля, новое оружие, боссы-тарелки, новые секторы"
  win_lose:
    lose: "Корпус 0 → взрыв → экран итогов → рестарт или возврат на станцию (потеря части груза)"
    goal: "Накопить на следующий корабль и победить босса сектора"

# ─────────────────────────────────────────────
flight:
  model: "Elite-подобная инерция, но плавная и управляемая"
  rotation: полные 360° по всем осям, без «потолка» по тангажу
  throttle: плавный набор и сброс скорости
  boost:
    key: Shift
    behavior: плавный форсаж с полосой заряда (не рывок)
    recharge: медленная, зависит от корабля
    feedback: FOV растёт, звезды вытягиваются, шум двигателя поднимается, хвост ярче
  strafe: {up: R, down: F, left_right: A/D, forward_back: W/S}
  sense_of_speed:
    - параллакс-фон в 3 слоя (дальние звёзды, туманность, близкая космическая пыль)
    - частицы-«пыль» пролетают мимо камеры
    - лёгкое вращение камеры вслед за поворотом корабля с запаздыванием
    - FOV и размытие по краям при форсаже
  camera: от третьего лица, мягкое следование, не трясётся без причины
  assist: автодоворот на захваченную цель до отключения захвата (флаг в настройках)

# ─────────────────────────────────────────────
combat:
  enemy_ai:
    states: [APPROACH, ATTACK, EVADE]
    speed: заметно медленнее игрока (реализм Elite), агрессия растёт с уровнем
    behavior: перед атакой облёт с дугой, при попадании уклонение, не «магнитятся» к игроку
  one_enemy_rule: враг по одному, следующий через 4 с после уничтожения (для обычных вылетов)
  weapons:
    lasers:
      heat: перегрев со шкалой; при перегреве блок на ~2 с, предупреждение цветом и звуком
      feel: светящиеся трассеры, вспышка у дула, искры при попадании, короткий hit-stop 30–50 мс
    missile:
      key: F (пуск), захват — удержание E
      lock: работает на большой дистанции, индикатор захвата растёт, звук-«тон» нарастает
      launch: стартует чуть ниже корабля, огненный хвост, дымный след
      counter: врагу разрешено сбить ракету
    nuke:
      count: 1
      recharge: после 10 сбитых врагов
      launch: вперёд, взрыв на безопасной дистанции от игрока
      feel: вспышка на весь экран, ударная волна, замедление времени на 0.3 с
  hit_feedback:
    - тряска камеры пропорциональна урону
    - красная виньетка при попадании по игроку
    - щит светится рябью в точке попадания, затем корпус
    - числа урона всплывают и гаснут
  destruction_sequence:
    - вспышка → огненный шар → ударное кольцо
    - обломки, вращающиеся и остывающие
    - катапультирующийся пришелец с джетпаком, плавно парит, его можно сбить
    - дроп: руда, кредиты, редкие модули
  bosses:
    type: тарелки
    phases: 3 (каждая меняет паттерн атаки, цвет ядра и музыку)
    telegraphing: перед сильной атакой подсветка и звук-предупреждение за 1 с
    rewards: гарантированный дроп, прогресс сектора

# ─────────────────────────────────────────────
economy_and_progression:
  stations:
    rule: торговля только на станциях, без посадки на планеты
    services: [торговля, ремонт, заправка, верфь, оружейная, склад]
  mining:
    asteroids: лазер добычи, шкала нагрева, дробление на фрагменты, разные руды
    cargo: ограниченный трюм, перегруз замедляет
  neutral_traffic: нейтральные транспортники, можно торговать/защищать/грабить (с последствиями репутации)
  ships:
    count_min: 5
    each_has: [уникальная модель, характеристики, слоты, цена, цвет-акцент]
    purchase: у верфи, старый корабль продаётся
  upgrades: [корпус, щит, реактор, охлаждение лазеров, трюм, форсаж, радар]
  balance:
    rule: все числа лежат в одном объекте CONFIG вверху файла и/или в YAML-таблице
    keys: [hp, shield, damage, speed, heat_rate, cooldown, price, drop_chance, enemy_spawn_rate]
    curve: каждый сектор +15–25% к HP и урону врагов; цены апгрейдов растут примерно в 1.5 раза за уровень
    goal: первые апгрейды доступны через 3–5 минут игры

# ─────────────────────────────────────────────
game_feel:   # то, что превращает «работает» в «великолепно»
  principles: "На каждое событие — минимум 3 канала отклика: свет + звук + движение"
  effects:
    - screen_shake: малая, средняя, большая; затухание экспоненциальное
    - hit_stop: 30–50 мс на крупные попадания
    - bloom: умеренный, чтобы не заливать экран
    - chromatic_aberration: слегка при форсаже и ударах
    - slow_motion: при взрыве босса и ядерной бомбе
    - easing: все анимации UI и камеры через easing (никакой линейности)
  particles:
    pooling: обязательно, объекты не создаются/удаляются на лету
    limits: PC до ~2000, iPhone до ~600 одновременно
  numbers_and_juice: всплывающие числа, счётчики кредитов с «накруткой», вспышки интерфейса при наградах

# ─────────────────────────────────────────────
visual_direction:
  style: "тёмный космос, единая палитра (глубокий чёрно-синий фон, неоновые акценты: бирюзовый — игрок, оранжевый — враги, золотой — награды)"
  ship_design: детальные модели, узнаваемый силуэт, световые панели, огни двигателей; игрок и враг визуально различимы с первого взгляда
  space:
    - туманности и звёздные поля слоями
    - солнце/планета в далёкой перспективе с ореолом
    - станции с огнями и вращающимися кольцами
  lighting: одно основное направленное «солнце» + заливающий свет; свечение эмиссивных деталей
  hud:
    layout: минимум на экране, ничего не перекрывает центр
    elements: [прицел, полоса корпуса, щит, перегрев лазеров, форсаж, скорость, цель, радар, ракеты, ядерка, кредиты]
    radar: сферический/дисковый, цветовая кодировка (враг, нейтрал, станция, астероид, босс)
    target_panel: имя, тип, HP, дистанция, векторная стрелка за экраном
    readability: крупные шрифты, высокий контраст, тёмная тема

# ─────────────────────────────────────────────
audio:
  engine: WebAudio, процедурная генерация (без внешних файлов, офлайн)
  sfx: [лазер, перегрев, ракета (старт/взрыв), ядерка, попадание в щит/корпус, взрыв, двигатель, форсаж, захват цели, UI-клики, покупка]
  engine_sound: высота и громкость зависят от скорости и форсажа
  music:
    menu: спокойная, атмосферная
    flight: фоновая, мягкая
    combat: интенсивность нарастает с числом врагов, плавный кроссфейд
    boss: отдельный трек, смена по фазам
  menu_choice: в меню выбор музыки (набор треков + громкость музыки/эффектов отдельно)
  rule: аудио запускается только после первого касания/клика (требование iOS/Safari)

# ─────────────────────────────────────────────
controls:
  pc:
    movement: WASD, R/F вверх/вниз, Shift форсаж
    aim: мышь, ЛКМ огонь
    weapons: Space ракета (или F по схеме захвата), E удержание — захват цели, Escape пауза
    keep: схему из ТЗ не менять без явной просьбы
  iphone:
    left: виртуальный стик (движение)
    right: свободный обзор/прицел
    buttons: большие кнопки — огонь, ракета, форсаж, захват, ядерка, пауза
    rules: зоны нажатия не меньше 48×48 px, не перекрывают центр, настраиваемая чувствительность, поддержка ориентации ландшафт
    haptics: короткая вибрация на попадание/взрыв, где поддерживается
  universal: пауза/продолжить/рестарт всегда доступны, ввод без задержки

# ─────────────────────────────────────────────
ux_flow:
  main_menu: [Играть, Продолжить, Корабли, Настройки, Музыка, Об игре]
  first_60_seconds: "короткое обучение в самой игре (подсказки у цели: «двигайся», «стреляй», «захвати E»), без стен текста, можно пропустить"
  pause: затемнение, продолжить / рестарт / настройки / в меню
  settings: [громкость музыки, громкость эффектов, чувствительность, качество графики (авто/низкая/высокая), вибрация, автодоворот]
  game_over: итоги (кредиты, убито, руда, время), кнопки «Ещё раз» и «На станцию»
  transitions: плавные, быстрые (до 0.4 с), без блокирующих загрузок

# ─────────────────────────────────────────────
persistence:
  storage: IndexedDB (основное), запасной вариант — localStorage
  saves: [кредиты, корабли и апгрейды, прогресс секторов, рекорды, настройки, статистика]
  versioning: поле version, миграции при изменении структуры
  rule: автосохранение при покупке, возврате на станцию, выходе в меню

# ─────────────────────────────────────────────
performance:
  targets: {pc_fps: 60, iphone_fps: "стабильные 30–60"}
  rules:
    - object pooling для пуль, ракет, частиц, обломков
    - devicePixelRatio не выше 2 (на iPhone при просадках опускать до 1.5)
    - instancing для астероидов и звёздных частиц
    - общие геометрии и материалы, без создания в цикле кадра
    - LOD для дальних объектов, отсечение невидимого
    - тени только где критично, постобработка отключается на слабых устройствах
  adaptive_quality: если средний FPS < 40 пять секунд подряд — автоматически понизить качество на ступень
  memory: dispose() для ушедших из игры объектов, без утечек

# ─────────────────────────────────────────────
reliability:
  - Нет ошибок в консоли при запуске и в течение 10 минут игры.
  - Рестарт и пауза не оставляют «призраков» (враги, ракеты, звуки).
  - Потеря фокуса вкладки ставит игру на паузу.
  - Нет «залипших» клавиш при смене окна.
  - Режим отладки (D): FPS, число объектов, хитбоксы, спавн врага, +кредиты.

# ─────────────────────────────────────────────
stages:   # порядок реализации, каждый этап — играбельная сборка
  1_vertical_slice: "Полёт + один корабль + один враг + лазеры + взрыв + HUD + пауза (всё на уровне «вау» по ощущению)"
  2_game_feel: "Тряска, частицы, hit-stop, bloom, звук на каждое событие"
  3_weapons: "Перегрев, захват E + ракета F, ядерка, ИИ противодействия"
  4_world: "Станции, астероиды и добыча, нейтральные транспорты, радар"
  5_economy: "Торговля, апгрейды, верфь, 5+ кораблей, баланс из CONFIG"
  6_bosses: "Боссы-тарелки с фазами, секторы, прогрессия"
  7_mobile: "Тач-управление, адаптивный HUD, оптимизация под iPhone"
  8_polish: "Меню, обучение, настройки, музыка, сохранения, итоговая шлифовка"

# ─────────────────────────────────────────────
acceptance_checklist:
  gameplay:
    - "[ ] Бой интересен с первой минуты, понятно что делать"
    - "[ ] Враги не слишком быстрые, но опасные"
    - "[ ] Ракета, ядерка, перегрев и захват работают как описано"
    - "[ ] Пришельца можно сбить, он плавно парит"
  feel:
    - "[ ] Каждое попадание и взрыв чувствуются (свет, звук, тряска)"
    - "[ ] Форсаж даёт ощущение скорости (FOV, звёзды, звук)"
    - "[ ] Параллакс виден в любой момент полёта"
  technical:
    - "[ ] 60 FPS на ПК, не ниже 30 на iPhone"
    - "[ ] Работает офлайн из одного файла"
    - "[ ] Сохранения переживают перезапуск"
    - "[ ] Нет ошибок в консоли"
  ux:
    - "[ ] Интерфейс на русском, тёмный, крупный"
    - "[ ] На iPhone всё достижимо большим пальцем"
    - "[ ] Пауза, рестарт, настройки и выбор музыки работают"

# ─────────────────────────────────────────────
deliverables:
  - STARFALL_CURRENT.html (обновлённый точечными правками, один файл) в репозитории, ветка main
  - STARFALL_PASSPORT.md и CHANGELOG.md (точечно: что добавлено, где в коде, какие параметры)
  - Краткий список изменений и известных ограничений (до 10 строк)

how_to_use:
  prompt_template: |
    Подключи репозиторий gipromeh/Starfall, прочитай STARFALL_MASTER_INSTRUCTION.yaml и STARFALL_PASSPORT.md.
    Работай по золотому правилу: ничего не переписывай, только точечные правки; то, что работает, не трогай.
    Задача: <что нужно>.
    В конце: пройди acceptance_checklist по затронутому, обнови паспорт и CHANGELOG.md, закоммить «vNN: что сделано», запушь в main.


# ─────────────────────────────────────────────
# ЕДИНАЯ БИБЛИОТЕКА ИГРОВЫХ РЕСУРСОВ
asset_library:
  root: assets/
  rule: Все игровые ресурсы и модели хранятся только внутри assets/. Не создавать каталоги ассетов в корне репозитория.
  categories:
    ships: assets/ships/       # корабли, истребители, транспорт и их GLB-модели
    droids: assets/droids/     # дроиды и автономные боевые платформы
    planets: assets/planets/   # планеты, спутники, звёзды и связанные материалы
    weapons: assets/weapons/   # вооружение, снаряды, турели и боевые эффекты как ресурсы
    artifacts: assets/artifacts/ # уникальные артефакты, предметы и сюжетные объекты
  rules:
    - Перед добавлением ассета проверить существующую категорию и не создавать дубликаты в корне.
    - Для самостоятельной модели использовать папку с постоянным уникальным ID, config.json и README.md; GLB, текстуры, анимации и preview хранить рядом с моделью.
    - Общие правила и карта каталогов описываются в assets/README.md; правила категории — в README.md соответствующей папки.
    - При изменении структуры или правил ассетов синхронно обновлять README.md, STARFALL_PASSPORT.md и этот файл; факт изменения фиксировать в CHANGELOG.md.
    - Каталог Droids/ в корне удалён. Единственный путь к дроидам — assets/droids/.
  runtime_integration:
    - "GLB-планеты подключать через уже загруженный THREE.GLTFLoader; не создавать второй рендерер или отдельную сцену."
    - "Планетарные тела добавлять в worldBodies и синхронно регистрировать в planetOrbits и worldPlanets."
    - "Нормализовать габариты GLB по bounding box, центрировать модель, отдельно контролировать атмосферу и частоту обновления."
    - "При загрузке ассета предусматривать обработчик ошибки; относительный URL должен соответствовать структуре assets/ и GitHub Pages."
    - "Не удалять и не подменять существующие процедурные планеты без отдельного согласования."
    - "Баланс освещения планет проверять отдельно от визуальной яркости диска звезды: точечный свет звезды, общий HemisphereLight и направленный свет камеры настраивать совместно."
    - "Не допускать плоской засветки планет общими источниками: сохранять контраст дневной и ночной сторон и видимость рельефа; после изменения света выполнять браузерную визуальную проверку."


