# STARFALL "Void Hunter" — МАСТЕР-ИНСТРУКЦИЯ v2.5 (2026-11-01)
# Нормативные правила разработки для любого AI coding agent и разработчика.
# Источник: репозиторий gipromeh/Starfall. Перед работой сверять инструкцию и паспорт с main.
# Исторические версии и экспериментальные материалы не заменяют production-файлы.

# ═════════════════════════════════════════════════════════════
# ★★★ ЗОЛОТОЕ ПРАВИЛО ★★★
# НЕ ПЕРЕПИСЫВАТЬ КОД. ТОЛЬКО ТОЧЕЧНЫЕ ИЗМЕНЕНИЯ И ДОБАВЛЕНИЯ.
# ВСЁ, ЧТО РАБОТАЕТ, — НЕ ТРОГАЕМ.
# ═════════════════════════════════════════════════════════════
golden_rule:
  statement: >
    Мы не переписываем код заново и не тратим токены на пересборку того,
    что уже успешно работает. Меняем только то, что просят, и добавляем только новое.
  how:
    - Найти место правки поиском по имени функции/переменной и прочитать затрагиваемый участок вместе с вызывающим и вызываемым кодом.
    - Вносить минимальный адресный патч; перед заменой проверить уникальность целевого фрагмента. Не перезаписывать весь STARFALL_CURRENT.html без технической необходимости.
    - Новое — отдельным блоком рядом с похожим кодом, с «приклейкой» минимумом строк в существующие функции.
    - Рабочие системы (полёт, бой, ИИ, взрывы, столкновения, станция, бар, сохранения, HUD) не рефакторить, не «улучшать попутно», не переименовывать, не переформатировать.
    - Видишь проблему вне задачи — не чини молча: запиши в паспорт (§11 «Известные ограничения») и скажи пользователю одной строкой.
    - Основной HTML крупный (сотни КБ): читать целиком только при обоснованной необходимости; обычно достаточно паспорта, поиска и связанных участков.
  forbidden:
    - Переписывать файл или функцию целиком, если задача решается правкой нескольких строк.
    - Менять дизайн, управление, баланс и формат сохранений, о которых не просили.
    - Не дублировать уже реализованное: перед разработкой сверять текущий код, паспорт и CHANGELOG; исторический stages не использовать как статусный список.
  budget_check: "Перед правкой спроси себя: можно ли решить это меньшим количеством изменённых строк? Если да — решай так."

# ═════════════════════════════════════════════════════════════
# ★★ ОБЯЗАТЕЛЬНОЕ ПРАВИЛО: ПРОВЕРКА ПРАВОК НА ЗДРАВЫЙ СМЫСЛ ★★
# Любой запрос на правки (в чате или в приложенном файле с указаниями) сначала проверяется,
# и только потом выполняется. Бездумное исполнение запрещено.
# ═════════════════════════════════════════════════════════════
sanity_check:
  applies_to: [чат-запросы, файлы с указаниями, списки правок, чужие патчи]
  technical_changes:   # оптимизация, замена, удаление или перенос участка кода, смена структуры данных
    before_doing:
      - Найти затрагиваемый код (поиск) и всё, что на него ссылается (вызовы, переменные, DOM id, ключи сохранения, CONFIG).
      - Проверить, что правка решает заявленную задачу и не ломает работающее: полёт, бой, столкновения, станция, бар, HUD, сохранения (sf_sv), iPhone-управление.
      - Для удаления или замены: убедиться, что код действительно не используется (поиск ссылок), нет побочных эффектов, нет коллизии коротких имён (см. паспорт §11).
      - Для оптимизации: убедиться, что узкое место реально там (оценка или замер), а выигрыш не стоит читаемости, FPS на iPhone или функциональности.
      - Проверить, что указание не противоречит паспорту, golden_rule и pillars.
    after_doing: "Проверить синтаксис основного скрипта и lint по паспорту §12; выполнить относящиеся к изменению автоматические тесты. Для браузерных изменений — Chromium smoke/regression tests. Не выдавать headless-тест за реальный iPhone/PC playtest."
  idea_changes:        # геймплей, дизайн, баланс, управление
    rule: Если правка явно вредит игре (ломает pillars, управление, баланс, читаемость), высказать возражение с причиной и предложить альтернативу.
  outcomes:
    ok: Правка разумна → выполнить точечно (golden_rule), в отчёте одной строкой отметить, что проверено.
    risky: Правка выполнима, но есть риск → выполнить безопасный вариант или спросить пользователя; риск назвать явно.
    wrong: Правка ломает работающее, бессмысленна или основана на ошибке (например, код уже используется, удалять нечего или нечем заменять) → НЕ выполнять; объяснить почему и предложить правильный вариант.
  tone: "Возражение краткое и по делу, без лекций. Решение остаётся за пользователем: если после объяснений он подтверждает правку, выполнить её, зафиксировав в паспорте риск."
  never: Молча выполнить сомнительное; молча «поправить по-своему», не сказав пользователю.

# ─────────────────────────────────────────────
# ПРОЦЕСС РАБОТЫ С GITHUB (единственный источник правды)
process:
  repo: https://github.com/gipromeh/Starfall   # ветка main
  current_version: v87
  files:
    game: STARFALL_CURRENT.html        # единственная актуальная версия игры
    passport: STARFALL_PASSPORT.md     # архитектура, переменные, таблицы, правила правок
    changelog: CHANGELOG.md
    instruction: STARFALL_MASTER_INSTRUCTION.yaml   # этот файл
    entry: index.html                  # редирект на STARFALL_CURRENT.html
  archive_warning: >
    Единственная production-сборка — STARFALL_CURRENT.html в main. Копии из старых чатов,
    локальных папок и сторонних артефактов не считать актуальными без сравнения с main.
    Приложенный файл игры не заменяет репозиторий: сравнить diff и переносить только согласованные изменения.
  chat_start:
    - Проверить состояние main и открытые PR; прочитать эту инструкцию, STARFALL_PASSPORT.md и относящиеся к задаче исходники/тесты.
    - Убедиться, что работа ведётся от актуального main и не конфликтует с незавершёнными изменениями.
  chat_work:
    - Любые изменения выполнять в отдельной feature/fix/docs-ветке; main не редактировать напрямую.
    - Сохранять узкий scope; перед коммитом запускать проверки, относящиеся к изменённым компонентам.
  chat_end:
    - При изменении поведения/архитектуры обновить паспорт; при изменении продукта обновить CHANGELOG. Для docs-only изменений не менять версию игры и не трогать HTML.
    - Создать commit с предметным сообщением, открыть PR в main, указать scope, сохранённые инварианты и фактически выполненные проверки.
    - Не выполнять merge и не заявлять о публикации без явного разрешения пользователя.
  phone_check: https://gipromeh.github.io/Starfall/   # GitHub Pages, ~1 мин после push

# ─────────────────────────────────────────────
meta:
  project: STARFALL "Void Hunter"
  entry_point: STARFALL_CURRENT.html
  passport: STARFALL_PASSPORT.md   # сначала прочитать, не переоткрывать архитектуру
  stack: "HTML5 + Three.js r128; один production HTML с основным игровым скриптом и отдельным скриптом 3D-бара; часть библиотек, моделей и шрифтов загружается с CDN"
  platforms: [PC (клавиатура+мышь), iPhone (тач, Safari)]
  network: "Для штатной загрузки CDN-зависимостей требуется интернет; автономная работа из одного HTML не гарантируется."
  ui_language: ru
  inspiration: Galaxy on Fire 2 (свободный полёт, торговля на станциях, руда, корабли), Elite (инерция, реализм)

# ─────────────────────────────────────────────
rules_of_work:
  - ★ Золотое правило (см. выше) выше любого пункта ниже: не переписывать работающий код, правки только точечные.
  - Сначала прочитай STARFALL_PASSPORT.md и нужные куски кода; ничего не переписывай с нуля.
  - Сохраняй текущий дизайн и схему управления, если пункт ниже прямо не просит иное.
  - Работай итерациями: один этап → играбельная сборка → проверка по чек-листу → следующий этап.
  - Каждый этап заканчивается рабочим файлом, который запускается без ошибок в консоли.
  - Функциональность важнее декора: красота не должна стоить FPS и читаемости.
  - После каждого этапа обновляй STARFALL_PASSPORT.md (что добавлено, где в коде, какие параметры).
  - Не ломай сохранения: при смене формата данных делай миграцию версии.
  - Если решение неочевидно — выбери разумный вариант по умолчанию, отметь его в паспорте, не останавливайся.

# ─────────────────────────────────────────────
pillars:   # три столпа, любое решение проверяется на них
  1: "Полёт должен ощущаться: масса, инерция, скорость, параллакс."
  2: "Каждое действие даёт отклик: свет, звук, тряска, цифры."
  3: "Всегда есть следующая цель: руда, апгрейд, корабль, босс."

# ─────────────────────────────────────────────
core_loop:
  short: "Лети → находи цель → бей/добывай → получай кредиты → улучшай корабль → иди дальше"
  seconds_30: "Обнаружение цели → ручное прицеливание/сопровождение → бой с враждебным кораблём → взрыв → добыча/подбор → награда"
  minutes_10: "Вылет со станции → астероидный пояс → бой → возврат → продажа/апгрейд"
  hours: "Покупка нового корабля, новое оружие, боссы-тарелки, новые секторы"
  win_lose:
    lose: "Корпус 0 → взрыв → экран итогов → рестарт или возврат на станцию (потеря части груза)"
    goal: "Накопить на следующий корабль и победить босса сектора"

# ─────────────────────────────────────────────
flight:
  model: "Elite-подобная инерция, но плавная и управляемая"
  rotation: полные 360° по всем осям, без «потолка» по тангажу
  throttle: плавный набор и сброс скорости
  boost:
    key: Shift
    behavior: плавный форсаж с полосой заряда (не рывок)
    recharge: медленная, зависит от корабля
    feedback: FOV растёт, звезды вытягиваются, шум двигателя поднимается, хвост ярче
  controls:
    throttle: "W/S или колесо мыши"
    lateral: "A/D"
    vertical: "R/C"
    roll: "Q/Z"
    aim: "мышь (ПК) или касание экрана (iPhone)"
  sense_of_speed:
    - параллакс-фон в 3 слоя (дальние звёзды, туманность, близкая космическая пыль)
    - частицы-«пыль» пролетают мимо камеры
    - лёгкое вращение камеры вслед за поворотом корабля с запаздыванием
    - FOV и размытие по краям при форсаже
  camera: от третьего лица, мягкое следование, не трясётся без причины
  assist: "Автодоворота и target lock нет. Режим H/СОПРОВОЖДЕНИЕ удерживает дистанцию до выбранного перед игроком врага; он не разворачивает корабль игрока и не является захватом цели."

# ─────────────────────────────────────────────
combat:
  enemy_ai:
    states: [APPROACH, ATTACK, EVADE]
    speed: заметно медленнее игрока (реализм Elite), агрессия растёт с уровнем
    behavior: перед атакой облёт с дугой, при попадании уклонение, не «магнитятся» к игроку
  one_enemy_rule: враг по одному, следующий через 4 с после уничтожения (для обычных вылетов)
  weapons:
    lasers:
      heat: перегрев со шкалой; при перегреве блок на ~2 с, предупреждение цветом и звуком
      feel: светящиеся трассеры, вспышка у дула, искры при попадании, короткий hit-stop 30–50 мс
    missile:
      key: "F или Space; ПКМ на ПК; отдельная кнопка на iPhone"
      aiming: "Ручное прицеливание по центральному перекрестию; ракета использует aimPoint. Target lock/удержание E отсутствует."
      launch: "Ракета стартует с подкрыльевого пилона и корректирует курс к рассчитанной мировой точке прицеливания."
      counter: "Не добавлять механику захвата цели без отдельного решения пользователя."
    nuke:
      count: 1
      recharge: после 10 сбитых врагов
      launch: вперёд, взрыв на безопасной дистанции от игрока
      feel: вспышка на весь экран, ударная волна, замедление времени на 0.3 с
  hit_feedback:
    - тряска камеры пропорциональна урону
    - красная виньетка при попадании по игроку
    - щит светится рябью в точке попадания, затем корпус
    - числа урона всплывают и гаснут
  destruction_sequence:
    - вспышка → огненный шар → ударное кольцо
    - обломки, вращающиеся и остывающие
    - катапультирующийся пришелец с джетпаком, плавно парит, его можно сбить
    - дроп: руда, кредиты, редкие модули
  bosses:
    type: тарелки
    phases: 3 (каждая меняет паттерн атаки, цвет ядра и музыку)
    telegraphing: перед сильной атакой подсветка и звук-предупреждение за 1 с
    rewards: гарантированный дроп, прогресс сектора

# ─────────────────────────────────────────────
economy_and_progression:
  stations:
    rule: торговля только на станциях, без посадки на планеты
    services: [торговля, ремонт, заправка, верфь, оружейная, склад]
  mining:
    asteroids: лазер добычи, шкала нагрева, дробление на фрагменты, разные руды
    cargo: ограниченный трюм, перегруз замедляет
  neutral_traffic: нейтральные транспортники, можно торговать/защищать/грабить (с последствиями репутации)
  ships:
    count_min: 5
    each_has: [уникальная модель, характеристики, слоты, цена, цвет-акцент]
    purchase: у верфи, старый корабль продаётся
  upgrades: [корпус, щит, реактор, охлаждение лазеров, трюм, форсаж, радар]
  balance:
    rule: все числа лежат в одном объекте CONFIG вверху файла и/или в YAML-таблице
    keys: [hp, shield, damage, speed, heat_rate, cooldown, price, drop_chance, enemy_spawn_rate]
    curve: каждый сектор +15–25% к HP и урону врагов; цены апгрейдов растут примерно в 1.5 раза за уровень
    goal: первые апгрейды доступны через 3–5 минут игры

# ─────────────────────────────────────────────
game_feel:   # то, что превращает «работает» в «великолепно»
  principles: "На каждое событие — минимум 3 канала отклика: свет + звук + движение"
  effects:
    - screen_shake: малая, средняя, большая; затухание экспоненциальное
    - hit_stop: 30–50 мс на крупные попадания
    - bloom: умеренный, чтобы не заливать экран
    - chromatic_aberration: слегка при форсаже и ударах
    - slow_motion: при взрыве босса и ядерной бомбе
    - easing: все анимации UI и камеры через easing (никакой линейности)
  particles:
    pooling: обязательно, объекты не создаются/удаляются на лету
    limits: PC до ~2000, iPhone до ~600 одновременно
  numbers_and_juice: всплывающие числа, счётчики кредитов с «накруткой», вспышки интерфейса при наградах

# ─────────────────────────────────────────────
visual_direction:
  style: "тёмный космос, единая палитра (глубокий чёрно-синий фон, неоновые акценты: бирюзовый — игрок, оранжевый — враги, золотой — награды)"
  ship_design: детальные модели, узнаваемый силуэт, световые панели, огни двигателей; игрок и враг визуально различимы с первого взгляда
  space:
    - туманности и звёздные поля слоями
    - солнце/планета в далёкой перспективе с ореолом
    - станции с огнями и вращающимися кольцами
  lighting: одно основное направленное «солнце» + заливающий свет; свечение эмиссивных деталей
  hud:
    layout: минимум на экране, ничего не перекрывает центр
    elements: [прицел, полоса корпуса, щит, перегрев лазеров, форсаж, скорость, цель, радар, ракеты, ядерка, кредиты]
    radar: сферический/дисковый, цветовая кодировка (враг, нейтрал, станция, астероид, босс)
    target_panel: имя, тип, HP, дистанция, векторная стрелка за экраном
    readability: крупные шрифты, высокий контраст, тёмная тема

# ─────────────────────────────────────────────
audio:
  engine: WebAudio, процедурная генерация (без внешних файлов, офлайн)
  sfx: [лазер, перегрев, ракета (старт/взрыв), ядерка, попадание в щит/корпус, взрыв, двигатель, форсаж, захват цели, UI-клики, покупка]
  engine_sound: высота и громкость зависят от скорости и форсажа
  music:
    menu: спокойная, атмосферная
    flight: фоновая, мягкая
    combat: интенсивность нарастает с числом врагов, плавный кроссфейд
    boss: отдельный трек, смена по фазам
  menu_choice: в меню выбор музыки (набор треков + громкость музыки/эффектов отдельно)
  rule: аудио запускается только после первого касания/клика (требование iOS/Safari)

# ─────────────────────────────────────────────
controls:
  pc:
    aim: "Мышь — прицел; ЛКМ — лазер."
    weapons: "ПКМ/F/Space — ракета; B — ядерный заряд; G — боевой/горный лазер."
    movement: "W/S или колесо — газ; A/D — стрейф; R/C — вертикальное перемещение; Q/Z — крен; Shift — форсаж; X — тормоз; V — разворот на 180°."
    utility: "H — сопровождение цели (удержание дистанции, не target lock); J — гиперпрыжок; Esc/P — пауза; M — музыка; ~/F3 — диагностика."
  iphone:
    aim: "Касание/перемещение пальца по экрану — прицел."
    buttons: "Огонь, ракета, форсаж, сопровождение, лазер; дополнительные действия — в панели меню."
    utility: "Ядерный заряд, разворот, тормоз, горный лазер и гиперпрыжок доступны через панель."
    haptics: "Вибрация только там, где поддерживается браузером и устройством."
  universal: пауза/продолжить/рестарт всегда доступны, ввод без задержки

# ─────────────────────────────────────────────
ux_flow:
  main_menu: [Играть, Продолжить, Корабли, Настройки, Музыка, Об игре]
  first_60_seconds: "Обучение должно соответствовать текущему управлению: прицеливание, лазер, ракета и сопровождение H. Не обучать удалённому target lock или автодовороту."
  pause: затемнение, продолжить / рестарт / настройки / в меню
  settings: [громкость музыки, громкость эффектов, чувствительность, качество графики, вибрация]
  game_over: итоги (кредиты, убито, руда, время), кнопки «Ещё раз» и «На станцию»
  transitions: плавные, быстрые (до 0.4 с), без блокирующих загрузок

# ─────────────────────────────────────────────
persistence:
  storage: "localStorage; SAVE 2.0 использует два чередующихся слота sf_sv2a/sf_sv2b с контрольной суммой и порядковым номером."
  legacy: "sf_sv читается для миграции; sf_sv_arc хранит резервную копию при начале новой игры."
  settings: "Профиль качества sf_q и помощь прицела sf_as хранятся отдельно; не утверждать, что все настройки входят в SAVE 2.0."
  versioning: "Версия формата SAVE 2.0; при изменении схемы обязательны миграция и регрессионные тесты."
  rule: "Проверять сохранение после операций на станции, покупки/продажи, взлёта, прыжка, выхода в меню и при жизненном цикле страницы."

# ─────────────────────────────────────────────
performance:
  targets: {pc_fps: 60, iphone_fps: "стабильные 30–60"}
  rules:
    - object pooling для пуль, ракет, частиц, обломков
    - devicePixelRatio не выше 2 (на iPhone при просадках опускать до 1.5)
    - instancing для астероидов и звёздных частиц
    - общие геометрии и материалы, без создания в цикле кадра
    - LOD для дальних объектов, отсечение невидимого
    - тени только где критично, постобработка отключается на слабых устройствах
  adaptive_quality: если средний FPS < 40 пять секунд подряд — автоматически понизить качество на ступень
  memory: dispose() для ушедших из игры объектов, без утечек

# ─────────────────────────────────────────────
reliability:
  - Нет ошибок в консоли при запуске и в течение 10 минут игры.
  - Рестарт и пауза не оставляют «призраков» (враги, ракеты, звуки).
  - Потеря фокуса вкладки ставит игру на паузу.
  - Нет «залипших» клавиш при смене окна.
  - Режим отладки (D): FPS, число объектов, хитбоксы, спавн врага, +кредиты.

# ─────────────────────────────────────────────
stages:   # исторический исходный план/GDD; НЕ является перечнем незавершённых задач
  classification: "HISTORICAL_BASELINE — статусы реализации определяются по STARFALL_PASSPORT.md и текущему коду."
  1_vertical_slice: "Полёт + один корабль + один враг + лазеры + взрыв + HUD + пауза"
  2_game_feel: "Тряска, частицы, hit-stop, bloom и звуковой отклик"
  3_weapons: "Оружие, ракеты, ядерный заряд и ИИ противодействия; исходное упоминание захвата E устарело"
  4_world: "Станции, астероиды и добыча, нейтральные транспорты, радар"
  5_economy: "Торговля, апгрейды, верфь и корабельный баланс"
  6_bosses: "Боссы, секторы и прогрессия"
  7_mobile: "Тач-управление, адаптивный HUD и оптимизация под iPhone"
  8_polish: "Меню, обучение, настройки, музыка, сохранения и полировка"

# ─────────────────────────────────────────────
acceptance_checklist:
  classification: "Критерии приёмки новых изменений, а не отчёт о текущей готовности всей игры."
  gameplay:
    - "[ ] Бой читаем и понятен; управление соответствует README и паспорту"
    - "[ ] Враги соответствуют утверждённому балансу"
    - "[ ] Ракеты, ядерный заряд, перегрев и сопровождение работают согласно текущему коду"
    - "[ ] Уничтожение и эффекты не создают утечек ресурсов"
  feel:
    - "[ ] Каждое попадание и взрыв чувствуются (свет, звук, тряска)"
    - "[ ] Форсаж даёт ощущение скорости (FOV, звёзды, звук)"
    - "[ ] Параллакс виден в любой момент полёта"
  technical:
    - "[ ] 60 FPS на ПК, не ниже 30 на iPhone"
    - "[ ] Игра запускается онлайн при доступности закреплённых CDN-зависимостей"
    - "[ ] Сохранения переживают перезапуск"
    - "[ ] Нет ошибок в консоли"
  ux:
    - "[ ] Интерфейс на русском, тёмный, крупный"
    - "[ ] На iPhone всё достижимо большим пальцем"
    - "[ ] Пауза, рестарт, настройки и выбор музыки работают"

# ─────────────────────────────────────────────
deliverables:
  - STARFALL_CURRENT.html (обновлённый точечными правками, один файл) в репозитории, ветка main
  - STARFALL_PASSPORT.md и CHANGELOG.md (точечно: что добавлено, где в коде, какие параметры)
  - Краткий список изменений и известных ограничений (до 10 строк)

how_to_use:
  prompt_template: |
    Подключи репозиторий gipromeh/Starfall, прочитай STARFALL_MASTER_INSTRUCTION.yaml и STARFALL_PASSPORT.md.
    Работай по золотому правилу: ничего не переписывай, только точечные правки; то, что работает, не трогай.
    Задача: <что нужно>.
    В конце: пройди acceptance_checklist по затронутому, обнови паспорт и CHANGELOG.md, закоммить «vNN: что сделано», запушь в main.


# ─────────────────────────────────────────────
# ЕДИНАЯ БИБЛИОТЕКА ИГРОВЫХ РЕСУРСОВ
asset_library:
  root: assets/
  rule: Все игровые ресурсы и модели хранятся только внутри assets/. Не создавать каталоги ассетов в корне репозитория.
  categories:
    ships: assets/ships/       # корабли, истребители, транспорт и их GLB-модели
    droids: assets/droids/     # дроиды и автономные боевые платформы
    planets: assets/planets/   # планеты, спутники, звёзды и связанные материалы
    weapons: assets/weapons/   # вооружение, снаряды, турели и боевые эффекты как ресурсы
    artifacts: assets/artifacts/ # уникальные артефакты, предметы и сюжетные объекты
  rules:
    - Перед добавлением ассета проверить существующую категорию и не создавать дубликаты в корне.
    - Для самостоятельной модели использовать папку с постоянным уникальным ID, config.json и README.md; GLB, текстуры, анимации и preview хранить рядом с моделью.
    - Общие правила и карта каталогов описываются в assets/README.md; правила категории — в README.md соответствующей папки.
    - При изменении структуры или правил ассетов синхронно обновлять README.md, STARFALL_PASSPORT.md и этот файл; факт изменения фиксировать в CHANGELOG.md.
    - Каталог Droids/ в корне удалён. Единственный путь к дроидам — assets/droids/.
  runtime_integration:
    - "GLB-планеты подключать через уже загруженный THREE.GLTFLoader; не создавать второй рендерер или отдельную сцену."
    - "Планетарные тела добавлять в worldBodies и синхронно регистрировать в planetOrbits и worldPlanets."
    - "Нормализовать габариты GLB по bounding box, центрировать модель, отдельно контролировать атмосферу и частоту обновления."
    - "При загрузке ассета предусматривать обработчик ошибки; относительный URL должен соответствовать структуре assets/ и GitHub Pages."
    - "Не удалять и не подменять существующие процедурные планеты без отдельного согласования."
    - "Баланс освещения планет проверять отдельно от визуальной яркости диска звезды: точечный свет звезды, общий HemisphereLight и направленный свет камеры настраивать совместно."
    - "Не допускать плоской засветки планет общими источниками: сохранять контраст дневной и ночной сторон и видимость рельефа; после изменения света выполнять браузерную визуальную проверку."


# ─────────────────────────────────────────────
# Исторические технические спецификации v69–v78 сохранены как архив, не нормативные требования.
historical_archive_v69_v78: |
  # v69 — НЕЗАВИСИМАЯ ПИРАТСКАЯ ЭСКАДРИЛЬ
  pirate_fleet:
    composition:
      total_active_slots: 3
      ships:
        - type: 0
          name: "Головорез"
          count: 2
        - type: 1
          name: "Шакал"
          count: 1
      rule: "Сохранять три активных боевых пилота; каждый слот управляется самостоятельным ИИ и ведёт огонь."
    architecture:
      manager: pirateFleet
      isolated_from: [E, E2]
      preserve:
        - штатные волны и боссы
        - существующий массив вражеских снарядов eb
        - управление, HUD и SAVE 2.0
      lifecycle:
        - "Создавать три активных корабля в составе 2+1 при начале полёта."
        - "При уничтожении очищать корабль и его индивидуальные эффекты; возвращать корабль того же типа в слот после задержки."
        - "Очищать флот при reset и toMenu."
    ai:
      states: [APPROACH, ATTACK_RUN, FIRING_PASS, OVERSHOOT, REPOSITION]
      requirements:
        - "У каждого пилота собственные скорость, вектор движения, состояние и таймеры стрельбы."
        - "Учитывать текущую скорость игрока и рассчитывать баллистическое упреждение."
        - "Ограничивать ускорение и скорость поворота; не допускать мгновенной остановки или зависания."
        - "Атакующий корабль должен пролетать мимо игрока, выходить из атаки и заходить повторно."
        - "Все три корабля должны самостоятельно вести огонь очередями, включая ближнюю дистанцию."
    combat_and_fx:
      - "Попадания игрока, ракеты и ядерный взрыв должны учитывать pirateFleet."
      - "Снаряды эскадрильи должны проходить через штатный цикл eb и наносить урон игроку."
      - "Повреждённые корабли должны дымить и гореть; двигатели должны оставлять выхлоп и след."
      - "Радар должен отображать все активные корабли."
      - "Награды за уничтожение не должны ошибочно продвигать номер волны для каждого корабля эскадрильи."
    mobile_performance:
      - "Разделять геометрию и материалы шаблонов между клонами; не создавать независимые копии ресурсов для каждого пилота."
      - "Не включать тени на каждом корабле флота."
      - "Ограничивать частоту trail/particle эффектов на touch-устройствах."
      - "После изменения проверять FPS, память и температуру на реальном iPhone; автоматический синтаксис-тест не заменяет визуальный прогон."
    acceptance:
      - "Одновременно присутствуют два Головореза и один Шакал."
      - "Все три корабля маневрируют и стреляют, включая ближнюю дистанцию."
      - "Обычные пули и ракеты игрока поражают корабли флота."
      - "Повреждённые корабли дымят и горят; уничтожение начисляет награду."
      - "Существующие E/E2, боссы, волны, управление и SAVE 2.0 продолжают работать."
      - "reset и возврат в меню не оставляют кораблей, снарядов или эффектов флота."
  
  
  # ─────────────────────────────────────────────
  # v70 — ЖИЗНЕННЫЙ ЦИКЛ И ПЕРЕИСПОЛЬЗОВАНИЕ РЕСУРСОВ ФЛОТА
  pirate_fleet_hardening:
    resources:
      - "Текстуры дыма и огня создавать однократно и разделять между всеми кораблями; не создавать CanvasTexture на каждое попадание."
      - "Индивидуальные SpriteMaterial освобождать при уничтожении; общие текстуры не dispose-ить до завершения жизни сцены."
      - "Снаряды эскадрильи помечать pirateFleet=true; очистка флота удаляет только помеченные снаряды из eb."
    lifecycle:
      - "Очищать эскадрилью и её снаряды при стыковке dock."
      - "Очищать эскадрилью при arrive после перехода в новый сектор."
      - "После lift/arrive создавать новую группу из трёх кораблей (2+1) при первом игровом обновлении."
      - "Сохранять очистку при reset и toMenu."
    acceptance:
      - "Повторные циклы повреждение → уничтожение → респавн не увеличивают количество GPU-текстур."
      - "После dock → lift снова создаются два Головореза и один Шакал."
      - "Снаряды флота не остаются в сцене после очистки."
  
  
  # ─────────────────────────────────────────────
  # v71 — КОМПАКТНАЯ ИСПРАВЛЕННАЯ ПИРАТСКАЯ ЭСКАДРИЛЬ
  pirate_fleet_combat_tuning:
    composition: {total_active_slots: 3, golovorez: 2, jackal: 1}
    orientation:
      model_forward_axis: "-Z"
      rule: "Quaternion.setFromUnitVectors(localForward, velocityHeading); нос модели, muzzle и вектор движения должны совпадать."
    maneuver:
      states: [APPROACH, ATTACK_RUN, FIRING_PASS, OVERSHOOT, REPOSITION]
      approach_distance: 900
      attack_distance: 520
      lateral_offsets: {approach: 130, attack: 55, pass: 45}
      turn_rate_rad_s: {golovorez: 2.0, jackal: 2.3}
      max_acceleration: {golovorez: 72, jackal: 100}
      heading_source: actual_velocity
      target_speed: {golovorez: 36, jackal: 43}
    weapons:
      fire_range: 1500
      spawn_distance: [520, 620, 720]
      pass_distance: 360
      pass_crossing_threshold: 150
      close_range: 280
      aim_angle_rad: 0.92
      fire_heading: actual_ship_forward
      close_aim_angle_rad: 1.35
      burst_shots: 5
      shot_interval_seconds: 0.16
      reload_seconds: [0.72, 1.10]
      lead: "Упреждение по скорости игрока; стрельба разрешена во всех фазах при попадании цели в огневой конус."
    removed_visuals:
      - "starTarget, starHalo, starCorona, starInnerCorona и центральные flare-спрайты"
      - "Ссылка на центральную звезду в planetNavUpdate; навигация сохраняет только worldPlanets"
    acceptance:
      - "В сцене нет центральной красной звезды и её короны."
      - "Одновременно работают три пилота в составе 2+1."
      - "Нос корабля направлен по вектору движения; сопла находятся сзади."
      - "Пираты стреляют очередями на дальней и ближней дистанции."
      - "Существующие E/E2, боссы, волны, управление и SAVE 2.0 продолжают работать."
  
  # ─────────────────────────────────────────────────────────────
  # v73 — КОРРЕКЦИЯ ОСИ PIRATE_FIGHTER_002, УЧАЩЁННЫЙ ОГОНЬ И УДАЛЕНИЕ ЗВЁЗДНЫХ ДИСКОВ
  pirate_fighter_002_orientation:
    asset: assets/ships/pirate/pirate_fighter_002/model.glb
    forward_axis: "-Z"
    required_nodes: [STARFALL_PIRATE_ASSET_ROOT, STARFALL_FORWARD_AXIS_FIX]
    rule: "Внутренняя группа STARFALL_FORWARD_AXIS_FIX повёрнута на 180° вокруг Y; внешний корень не вращать — он получает quaternion направления от ИИ."
    legacy_glb: "Если GLB не содержит маркера STARFALL_FORWARD_AXIS_FIX, добавить вложенную runtime-группу Y=PI; если маркер есть, не применять коррекцию повторно."
    rebuild: "build_blender.py экспортирует нейтральный корень и вложенную группу коррекции; viewer.html использует ту же проверку маркера."
  pirate_fleet_v73:
    composition: {total_active_slots: 3, golovorez: 2, jackal: 1}
    firing:
      range: 1300
      close_range: 720
      angle_radians: {normal: 1.0, close: 1.6}
      burst: {shots: 5, gap_seconds: 0.12, cooldown_seconds: "0.48–0.76"}
      projectile: {speed: {golovorez: 190, jackal: 210}, lifetime_seconds: 7.0}
    star_removal:
      - "Не создавать starTarget, star2 или sun2; st2 — существующий обработчик мобильного ползунка газа, не звёздный объект."
      - "Сохранять нейтральный невидимый systemKeyLight для планет."
    acceptance:
      - "Мировой вектор реального носа каждой модели совпадает с фактической скоростью корабля."
      - "Legacy GLB и GLB после Blender-пересборки не получают двойной поворот."
      - "Пираты открывают огонь в ближней зоне до 720 единиц, а не только на огневом проходе."
      - "Видимые диски звёзд и их дополнительные короны отсутствуют."
  
  # ─────────────────────────────────────────────────────────────
  # v74 — ПОРЯДОК ЗАГРУЗКИ ПИРАТСКИХ МОДЕЛЕЙ
  pirate_fleet_asset_readiness:
    init_guard: "pirateFleetInit и pirateFleetUpdate не создают шаблоны до pirateAssetsчтениеy=true."
    fallback: "pirateAssetsчтениеy выставляется после загрузки обеих GLB либо после обработки ошибки загрузки; процедурная модель остаётся резервом."
    reason: "Не кэшировать процедурный fallback до прихода GLB и не требовать доступа тестов к закрытому кэшу MC."
    acceptance:
      - "После lift эскадрилья создаётся автоматически после завершения загрузки ассетов."
      - "В регрессионном тесте проверяется фактическая вложенная осевая группа и мировой вектор носа корабля."
  
  # ─────────────────────────────────────────────────────────────
  # v75 — СВЕТОВАЯ СХЕМА, СОКЕТЫ ОРУЖИЯ И ИНЕРЦИОННЫЙ БОЙ ПИРАТОВ
  pirate_fleet_v75:
    composition: {total_active_slots: 3, golovorez: 2, jackal: 1}
    lighting:
      ambient_intensity: 0.4
      directional_intensity: 1.3
      central_point_light_intensity: 0
      star_disks: false
    model_sockets:
      pirate_fighter_002:
        muzzle: [GUN_0, GUN_1, GUN_2, GUN_3]
        engines: [ENG_0, ENG_1]
        fallback: "Если именованные сокеты отсутствуют, использовать локальные позиции корпуса."
    ai:
      phases: [APPROACH, ATTACK_RUN, FIRING_PASS, OVERSHOOT, REPOSITION]
      rule: "Сохранять инерцию, широкий огневой пролёт и упреждение; не разворачивать корпус мгновенно."
      firing:
        range: 1300
        close_range: 720
        angle_radians: {normal: 1.0, close: 1.6}
        burst: {shots: 5, gap_seconds: 0.12, cooldown_seconds: "0.48–0.76"}
    acceptance:
      - "Все три активных пилота стреляют; «Ржавый череп» выпускает четыре луча из GUN_0…GUN_3."
      - "Каждый лазер начинается в мировых координатах своего сокета и направлен на рассчитанную точку упреждения."
      - "Пламя/следы двигателя исходят из ENG_0 и ENG_1; для старых моделей остаётся резервная локальная позиция."
      - "Световая схема не возвращает видимый звёздный диск или красную центральную засветку."
  
  
