# ПРОЦЕСС РАБОТЫ С GITHUB (единственный источник правды)
process:
  repo: https://github.com/gipromeh/Starfall   # ветка main
  hosting_policy:
    authority: "Единственная разрешённая платформа публикации игры — GitHub Pages."
    rules:
      - "Vercel запрещён для STARFALL и не должен использоваться ни при каких обстоятельствах."
      - "Не создавать и не подключать Vercel projects, GitHub integrations, deployments, domains, tokens или другие Vercel resources."
      - "Не добавлять Vercel в workflows, scripts, repository settings, документацию или пользовательские инструкции."
      - "GitHub Pages — единственный production hosting/deployment target; использовать существующий workflow .github/workflows/deploy-starfall-pages.yml."
      - "Vercel checks, deployment statuses и preview URLs являются внешними, неавторитетными для проекта сигналами: не запускать их, не устранять их сбои и не включать в CI/release acceptance criteria."
      - "Если Vercel status автоматически появляется в PR, зафиксировать, что платформа не используется; он не является обязательной проверкой и не блокирует приёмку STARFALL."
  current_version: v103.6
  pirate_ai_policy:
    scope: "Пиратские истребители, roaming pirates и истребители пиратского конвоя."
    library: "Yuka 0.7.8 MIT, локально в src/vendor/yuka.js; адаптер src/ai/yuka-pirate-flight.js."
    rules:
      - "Yuka Vehicle Steering и PursuitBehavior, EvadeBehavior, WanderBehavior, ArriveBehavior являются единственным контуром движения и ориентации пиратской авиации."
      - "Не восстанавливать HARMLESS pursuit, Pirate AI Core, pirateFleetPursuit/pirateFleetPhase или EAI.command/EAI.integrate для движения пиратов."
      - "Starfall сохраняет физическое исполнение, оружие, урон, эффекты, Three.js и общую симуляцию; огневые механики не являются контроллером полёта."
      - "Эксперимент не меняет AI торговцев, гражданского трафика и прочих NPC."
      - "Пиратские транспортники и конвойный груз должны участвовать в swept collision игрока и парном разрешении столкновений NPC с радиусом, вычисленным по полной геометрии корпуса."
      - "Крейсерская скорость маршрутного пиратского конвоя — 100 игровых единиц/с; обычный пиратский транспортный трафик — 58–74 единицы/с."
  ci_policy:
    principle: "Повторный запуск проверок определяется областью изменений и зависимостями, а не самим фактом нового коммита."
    rules:
      - "Результат workflow учитывается только для проверенного commit SHA; успешный тест игрового кода сохраняет силу для того же SHA игрового кода, если последующий коммит не меняет игру, тесты, зависимости или конфигурацию, влияющую на тест."
      - "При изменениях только документации, метаданных версии или текста паспорта не запускать повторно полную browser matrix автоматически, если игровой HTML, тесты, зависимости и test configuration не менялись."
      - "Для документационных изменений запускать Project Auditor и проверки документов, паспорта, ссылок и версионной согласованности, затронутые изменением."
      - "Если обязательная PR-проверка повторно запускается GitHub автоматически, дождаться её завершения; не считать её заменой целевых проверок."
      - "Полный game-tests/browser CI обязателен при изменениях игрового кода, тестов, зависимостей, сборки, runtime-конфигурации либо при исправлении ошибки, связанной с предыдущим тестовым прогоном."
      - "При изменении только версии документации не повышать версию игры; синхронизировать process.current_version с meta[name=starfall-version] в starfall.html и STARFALL_PASSPORT.md."
      - "Перед merge проверить актуальные обязательные PR checks, их conclusion и SHA; не использовать устаревший успешный запуск для другого игрового SHA."
  files:
    game: starfall.html        # единственная актуальная версия игры
    passport: STARFALL_PASSPORT.md     # архитектура, переменные, таблицы, правила правок
    changelog: CHANGELOG.md
    instruction: STARFALL_MASTER_INSTRUCTION.yaml   # этот файл
    entry: index.html                  # редирект на starfall.html
  archive_warning: >
    Всё, что лежит в проекте Claude (STARFALL_2.html, STARFALL 2.html, claude/starfall.html,
    паспорта, changelog) — архив на момент v40. Брать за основу нельзя, перезаписывать не нужно.
    Приложенный файл игры из другого места не заменяет репозиторий: сравнить дифф с starfall.html
    и перенести только нужные правки.
  chat_start:
    - Подключить репозиторий (add_repo, право записи), склонировать одним clone, прочитать эту инструкцию и STARFALL_PASSPORT.md.
    - starfall.html читать точечно (Grep + Read кусками), а не целиком.
  chat_work:
    - Правки только в клоне, по золотому правилу.
    - Перед коммитом проверка скрипта (команды в паспорте §12): node --check основного <script>, ESLint.
  chat_end:
    - "Перед завершением любой задачи сверить фактическую версию игры в starfall.html, STARFALL_PASSPORT.md и process.current_version."
    - "Обновить паспорт и CHANGELOG.md при каждом изменении игрового кода; не оставлять сведения о версии и SHA устаревшими."
    - "Проверить README.md по правилам process.readme_sync и обновить его в том же PR, если сработал хотя бы один триггер синхронизации."
    - "Документационные изменения выполнять отдельным логическим коммитом/PR; не повышать версию игры без изменения starfall.html."
    - "Работать через feature-ветку и Pull Request в main; дождаться завершения всех обязательных workflow, проверить их итог и только затем разрешать merge согласно правилам репозитория. Не запускать параллельные изменения в тех же файлах, пока предыдущий workflow не завершён."
    - "После push проверить commit main, CI и доступную GitHub Pages сборку; не объявлять релиз завершённым до проверки."
    - "В проект Claude ничего не записывать."
  readme_sync:
    purpose: "README.md — актуальная точка входа в проект; он описывает состояние main, а не историю разработки или планы."
    authority: "Фактическое состояние сверять с starfall.html, STARFALL_PASSPORT.md, CHANGELOG.md, структурой main и активными workflow; README не является источником версии игры."
    mandatory_triggers:
      - "Каждый релиз с изменением starfall.html: проверить README и синхронизировать версию и краткое описание реализованных изменений в том же PR."
      - "Изменение пользовательски видимой механики, управления, платформ, запуска или требований к подключению."
      - "Изменение структуры репозитория, основных файлов, каталогов ресурсов или ссылок на ключевую документацию."
      - "Изменение CI, тестового покрытия, правил ветвления/PR/merge, публикации или доступных способов запуска."
      - "Изменение статуса крупной подсистемы, если README описывает её состояние или ограничения."
    content_rules:
      - "Указывать только реализованные и доступные в main функции; планы, эксперименты и незамерженные PR явно маркировать как планы/эксперименты либо не включать в описание текущей игры."
      - "Версию брать из meta[name=starfall-version] в starfall.html; не выводить её из номера PR, CHANGELOG или заголовка коммита."
      - "Сводку изменений в README держать краткой; подробную историю версий оставлять в CHANGELOG.md, архитектуру — в STARFALL_PASSPORT.md."
      - "Проверять все пути, имена файлов, ссылки, команды запуска, платформы и ограничения по фактическому содержимому main."
      - "Не указывать устаревшие версии, закрытые/несуществующие PR как текущий статус и не заявлять о проверках, которые не выполнялись."
    execution:
      - "Проверку и необходимую правку README выполнять в том же PR, что и изменение, вызвавшее триггер; не откладывать синхронизацию до следующего релиза."
      - "Если триггер не сработал, не менять README ради косметического обновления."
      - "При документационном изменении без изменения starfall.html не менять версию игры; кратко фиксировать изменение политики/структуры документации в CHANGELOG.md."
    acceptance:
      - "README version == starfall.html meta version."
      - "README describes only current main behavior and valid repository paths/links."
      - "No stale PR, release, workflow or platform claims remain."
  release_versioning:
    authority: "Единственный источник фактической версии — meta[name=starfall-version] в starfall.html; паспорт и process.current_version обязаны совпадать с ним."
    format: "vMAJOR[.PATCH], например v92, v92.1, v92.2."
    rules:
      - "Любой релиз с изменением игрового HTML обязан обновить маркер starfall-version, game_version в паспорте, process.current_version в этой инструкции, main_file_sha256 в паспорте и запись CHANGELOG.md в одном релизном коммите."
      - "Исправление ошибок без изменения набора функций увеличивает PATCH: v92 → v92.1 → v92.2."
      - "Новая завершённая функциональность или заметное расширение игрового опыта увеличивает основную версию: v92.x → v93."
      - "Документационные и тестовые изменения без изменения игрового HTML не меняют версию игры; при этом changelog должен честно указывать, что игровой код не менялся."
      - "Запрещено называть изменение v92.1 в CHANGELOG, если в самой игре и паспорте остаётся v92. Номер релиза, отображаемый в игре, и номер в документации всегда должны совпадать."
      - "Не повышать версию только ради косметического переименования. Сначала определить тип изменения и проверить его фактический состав."
      - "После правки пересчитать SHA-256 игрового файла штатным tools/check_passport.py --fix, затем проверить паспорт и пройти CI."
      - "В ответе пользователю указывать фактический номер из HTML, краткий состав релиза и статус CI; отдельно обозначать, если проверка на реальном iPhone/PC не проводилась."
    release_checklist:
      - "HTML version marker == passport game_version == process.current_version."
      - "Passport SHA-256 matches starfall.html."
      - "CHANGELOG entry uses the same release number and describes only shipped changes."
      - "Automated tests and CI pass."
      - "GitHub Pages serves the intended main build."
  phone_check: https://gipromeh.github.io/Starfall/   # GitHub Pages, ~1 мин после push

